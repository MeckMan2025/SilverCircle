<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SilverCircle — Peer Tutoring</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="theme-color" content="#0b2375">
<style>
  :root{
    --bg:#eef2fb; --card:#ffffff; --ink:#2f3350; --muted:#8b8fa8; --line:#eceaf5;
    --blue:#7aa7f0; --blue-d:#4d7fd6; --pink:#f28fb4; --pink-d:#e0679a;
    --purple:#a78be6; --green:#63c39a; --orange:#f0a868; --star:#f5b942;
    --good:#3fae7a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh;
  }
  /* App shell — a sidebar like ETS, content on the right */
  .app{min-height:100vh}
  .side{
    position:fixed; top:0; left:0; bottom:0; width:256px; z-index:40;
    background:rgba(255,255,255,.94); backdrop-filter:blur(8px);
    box-shadow:0 0 24px rgba(60,50,110,.10); display:flex; flex-direction:column;
    transform:translateX(-100%); transition:transform .25s ease;
  }
  .app.open .side{transform:none}
  .scrim{position:fixed; inset:0; background:rgba(0,0,0,.3); z-index:30; display:none}
  .app.open .scrim{display:block}
  .side .shead{display:flex; align-items:center; gap:9px; padding:16px; border-bottom:1px solid var(--line)}
  .side .shead .logo{width:30px;height:30px;border-radius:9px;background:#0a2374 url(img/logo-icon.png) center/cover no-repeat;flex:0 0 auto}
  .side .shead b{font-size:17px; font-weight:800}
  .side .shead{position:relative}
  .side .shead .dots{margin-left:auto; border:none; background:none; font-size:20px; font-weight:900; color:var(--muted); cursor:pointer; width:32px; height:32px; border-radius:8px}
  .side .shead .dots:hover{background:#eef0f6}
  .menuscrim{position:fixed; inset:0; z-index:44}
  .menu-pop{position:absolute; top:52px; right:10px; z-index:45; width:190px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:6px; box-shadow:0 12px 32px rgba(60,50,110,.18)}
  .menu-pop hr{margin:4px}
  .side .shead .x{ border:none; background:none; font-size:20px; color:var(--muted); cursor:pointer; padding:2px 6px; border-radius:6px}
  .modes{display:flex; gap:4px; margin:10px 10px 2px; background:#eef0f6; padding:4px; border-radius:11px}
  .modes button{flex:1; border:0; background:transparent; padding:8px 0; border-radius:8px; font:inherit; font-size:13.5px; font-weight:700; color:#6b7088; cursor:pointer}
  .modes button.on{background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(20,25,40,.14)}
  .side nav{flex:1; overflow-y:auto; padding:8px}
  .nitem{display:flex; align-items:center; gap:10px; width:100%; border:none; background:none; cursor:pointer;
    padding:9px 12px; border-radius:10px; font:inherit; font-size:14.5px; font-weight:600; color:#5b6077; text-align:left}
  .nitem:hover{background:#e3ecfd}
  .nitem.on{background:#fcdbe8; color:var(--ink)}
  .nitem .ic{width:20px; text-align:center; font-size:16px}
  .nitem .chev{margin-left:auto; color:var(--muted); font-size:12px; transition:transform .2s}
  .nitem .chev.down{transform:rotate(90deg)}
  .nitem .count{margin-left:auto; background:var(--pink-d); color:#fff; font-size:10.5px; font-weight:800; border-radius:9px; padding:1px 7px}
  .sub{padding:2px 0 4px 18px}
  .sub .nitem{font-size:13.5px; padding:7px 10px}
  .sub .dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto}
  .sub .add{color:var(--blue-d)}
  .side hr{border:none; border-top:1px solid var(--line); margin:8px 4px}
  .side .sfoot{border-top:1px solid var(--line); padding:12px}
  .side .who{display:flex; align-items:center; gap:10px; margin-bottom:2px}
  .side .who .avatar{width:34px;height:34px;font-size:13px}

  .main{min-height:100vh; display:flex; flex-direction:column}
  .head{
    position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px;
    padding:12px 18px; background:rgba(238,242,251,.9); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  }
  .head .menu{border:none; background:#fff; border-radius:10px; width:38px; height:38px; font-size:18px; cursor:pointer; box-shadow:0 2px 8px rgba(60,50,110,.12)}
  .head h1{font-size:17px; margin:0; font-weight:800}
  .head .right{margin-left:auto; font-size:12px; color:var(--muted); font-weight:700; text-align:right}
  .bell{position:relative; border:none; background:#fff; border-radius:10px; width:38px; height:38px; font-size:18px; cursor:pointer; box-shadow:0 2px 8px rgba(60,50,110,.12); flex:0 0 auto}
  .issuebtn{color:#c23b5e; font-weight:900; font-size:19px; margin-left:6px}
  .issues textarea{width:100%; box-sizing:border-box; padding:9px 10px; border:1.5px solid #e5e2f0; border-radius:10px; font:inherit; font-size:14px; resize:vertical}
  .bell .n{position:absolute; top:-5px; right:-5px; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--pink-d); color:#fff; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center}
  .nscrim{position:fixed; inset:0; z-index:29}
  .notifs{position:absolute; right:12px; top:58px; width:min(380px, calc(100vw - 24px)); background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 36px rgba(60,50,110,.18); z-index:30; max-height:70vh; overflow:auto}
  .notifs .nh{display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line); font-weight:800}
  .notifs .nh button{margin-left:auto; border:none; background:none; color:var(--blue-d); font:inherit; font-size:12px; font-weight:800; cursor:pointer}
  .nrow{display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left; padding:11px 14px; border:none; border-bottom:1px solid var(--line); background:#fff; font:inherit; color:var(--ink); cursor:pointer}
  .nrow:last-child{border-bottom:none} .nrow:hover{background:#faf8ff}
  .nrow.unread{background:#f3f6ff} .nrow .ic{font-size:18px; flex:0 0 auto} .nrow .t{font-weight:700; font-size:13.5px} .nrow .s{font-size:12px; color:var(--muted); margin-top:2px}
  .nrow .dot{width:8px; height:8px; border-radius:50%; background:var(--pink-d); margin:6px 0 0 auto; flex:0 0 auto}
  .head{position:sticky}
  @media (max-width:640px){ .head .right{display:none} .head h1{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap} }
  .scroll{flex:1; width:100%; max-width:980px; margin:0 auto; padding:18px 18px 60px}

  @media (min-width:900px){
    .side{transform:none}
    .side .shead .x, .head .menu, .scrim{display:none !important}
    .main{margin-left:256px}
  }

  /* Grids */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px}
  .grid .card + .card{margin-top:0}
  .classcard{cursor:pointer; position:relative; border-top:5px solid var(--c)}
  .classcard .rm{position:absolute; top:8px; right:8px; border:none; background:#f3f1f9; color:var(--muted); width:26px; height:26px; border-radius:50%; cursor:pointer; font-size:14px}
  .addcard{display:flex; align-items:center; justify-content:center; gap:8px; min-height:96px; cursor:pointer; border:2px dashed #d6dcf0; background:transparent; box-shadow:none; color:var(--blue-d); font-weight:800}
  .cols{display:grid; grid-template-columns:1fr; gap:16px}
  @media (min-width:760px){ .cols{grid-template-columns:3fr 2fr} .cols.even{grid-template-columns:1fr 1fr} }
  /* Side-by-side cards end on the same line, whichever list is longer */
  .cols.even > div{display:flex; flex-direction:column}
  .cols.even > div > .card:last-child{flex:1}

  /* Calendar */
  .calhead{display:flex; align-items:center; gap:8px; margin-bottom:10px}
  .calhead h3{margin:0; font-size:18px; font-weight:800; flex:1}
  .calhead button{border:1px solid var(--line); background:#fff; border-radius:10px; padding:7px 12px; font-weight:800; cursor:pointer; color:var(--ink)}
  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
  .cal .dow{font-size:11px; font-weight:800; color:var(--muted); text-align:center; padding:4px 0; text-transform:uppercase}
  .cal .day{background:#fff; border:1px solid var(--line); border-radius:10px; min-height:84px; padding:5px; cursor:pointer; overflow:hidden; text-align:left; font:inherit; color:var(--ink); display:flex; flex-direction:column; justify-content:flex-start; min-width:0}
  .pencil{border:none; background:#f2f0fb; border-radius:8px; width:28px; height:28px; cursor:pointer; font-size:13px; margin-left:auto}
  .pencil:hover{background:#e3ecfd}
  .freesqs{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:5px}
  .freesq{border:1px solid #cdebd9; background:#f1faf5; border-radius:9px; padding:5px 2px; min-height:52px; display:flex; flex-direction:column; align-items:center; gap:1px; cursor:pointer; font:inherit; min-width:0}
  .freesq:hover{border-color:#9fd8b9}
  .freesq .d{font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.3px; color:var(--ink); margin-bottom:2px}
  .freesq .t{font-size:9.5px; font-weight:700; color:#2e9b6a; white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis}
  .freesq.none{background:#f6f5fa; border-color:var(--line)}
  .freesq.none .t{color:var(--muted)}
  .freesq.today{box-shadow:0 0 0 2px #dbe5fb}
  .periodrow{display:flex; align-items:center; gap:6px; padding:6px 0; border-bottom:1px solid var(--line); flex-wrap:wrap}
  .periodrow select{flex:1; min-width:160px; padding:8px 9px; border:1.5px solid #e5e2f0; border-radius:9px; font:inherit; font-size:14px; color:var(--ink); background:#fff}
  .periodrow .pn{font-weight:800; font-size:14px; width:72px; flex:0 0 auto}
  .periodrow .pt{font-size:11.5px; color:var(--muted); font-weight:700; width:120px; flex:0 0 auto}
  .periodrow.study select{background:#eefaf3; border-color:#bfe6cf}
  .periodrow input{padding:8px 9px; border:1.5px solid #e5e2f0; border-radius:9px; font:inherit; font-size:14px; color:var(--ink); background:#fff}
  .periodrow input:first-child{flex:1; min-width:110px; font-weight:700}
  .periodrow .del{border:none; background:none; color:var(--muted); cursor:pointer; font-size:16px; margin-left:auto}
  .chat{display:flex; flex-direction:column; gap:6px; height:52vh; min-height:280px; overflow-y:auto; padding:4px 2px}
  .chatwrap{display:flex; flex-direction:column; height:calc(100vh - 230px); min-height:360px}
  .chatwrap .card.chatcard{flex:1; min-height:0; display:flex; flex-direction:column; margin-bottom:0}
  .chatwrap .chat{flex:1; height:auto; min-height:0}
  .chatwrap .composer{margin-top:10px}
  .msg .rep{font-size:10px; color:var(--muted); cursor:pointer; margin-left:6px} .msg .rep:hover{color:#c23b5e}
  .msg{max-width:78%; padding:8px 12px; border-radius:14px; font-size:14px; line-height:1.4; background:#fff; border:1px solid var(--line); align-self:flex-start}
  .msg.me{align-self:flex-end; background:#e3ecfd; border-color:#d3e0fb}
  .msg .t{font-size:10.5px; color:var(--muted); font-weight:700; margin-top:2px}
  .msg.sys{align-self:center; background:none; border:none; color:var(--muted); font-size:12px; font-weight:700; text-align:center}
  .acts{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
  .acts button{border:1px solid var(--line); background:#fff; border-radius:9px; padding:6px 10px; font:inherit; font-size:12.5px; font-weight:800; color:var(--blue-d); cursor:pointer}
  .cal .day{position:relative}
  .cal .day .plus{position:absolute; top:4px; right:4px; width:24px; height:24px; border-radius:50%; border:none; cursor:pointer;
    background:#f2f0fb; color:var(--muted); font-size:16px; font-weight:800; line-height:1; display:flex; align-items:center; justify-content:center}
  .cal .day:hover .plus, .cal .day .plus:focus-visible{background:var(--blue-d); color:#fff}
  @media (max-width:600px){ .cal .day .plus{width:18px; height:18px; font-size:13px; top:2px; right:2px} }
  .dm-back{position:fixed; inset:0; background:rgba(30,30,60,.35); z-index:60; display:flex; align-items:center; justify-content:center; padding:16px}
  .dm{background:var(--bg); border-radius:18px; width:100%; max-width:520px; max-height:88vh; overflow-y:auto; padding:16px; box-shadow:0 20px 60px rgba(30,30,60,.3)}
  .dm .dmhead{display:flex; align-items:center; gap:8px; margin-bottom:10px}
  .dm .dmhead h3{margin:0; font-size:18px; font-weight:800; flex:1}
  .dm .dmhead button{border:none; background:#fff; width:32px; height:32px; border-radius:50%; font-size:16px; color:var(--muted); cursor:pointer}
  .cal .day.out{opacity:.4}
  .cal .day.today .n{background:var(--blue-d); color:#fff}
  .cal .day.sel{border-color:var(--purple); box-shadow:0 0 0 2px #e4dcfa}
  .cal .day .n{align-self:flex-start; display:inline-flex; width:24px; height:24px; align-items:center; justify-content:center; border-radius:50%; font-size:12.5px; font-weight:800}
  .cal .ev{font-size:10.5px; font-weight:700; padding:2px 5px; border-radius:6px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:#f2f0fb; border-left:3px solid var(--c)}
  .cal .more{font-size:10px; color:var(--muted); font-weight:700; margin-top:2px}
  @media (max-width:600px){
    .cal .day{min-height:52px}
    .cal .ev{font-size:0; padding:0; height:6px; border-left:none; background:var(--c)}
    .cal .more{display:none}
  }
  .evrow{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line)}
  .evrow:last-child{border-bottom:none}
  .evrow .bar{width:4px; align-self:stretch; border-radius:3px; background:var(--c)}
  .evrow .del{margin-left:auto; border:none; background:none; color:var(--muted); cursor:pointer; font-size:16px}

  /* Sign-in: a centred card, no sidebar or header behind it */
  .app.auth .side,.app.auth .scrim,.app.auth .head{display:none !important}
  .app.auth .main{margin-left:0}
  .app.auth .scroll{max-width:none; padding:0}
  .auth-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:28px 16px;
    background:radial-gradient(900px 520px at 15% -10%, #dde8fd 0%, transparent 60%), radial-gradient(800px 520px at 100% 110%, #fbe3ee 0%, transparent 60%), var(--bg)}
  .auth-card{width:100%; max-width:400px; background:#fff; border:1px solid var(--line); border-radius:22px; padding:28px 24px 22px; box-shadow:0 22px 60px rgba(60,50,110,.14)}
  .auth-logo{width:58px; height:58px; border-radius:17px; background:#0a2374 url(img/logo-icon.png) center/cover no-repeat; margin:0 auto 12px; box-shadow:0 10px 22px rgba(11,35,117,.28)}
  .auth-wordmark{display:block; width:min(260px, 80%); margin:0 auto 14px; border-radius:16px; box-shadow:0 10px 22px rgba(11,35,117,.25)}
  .auth-card h2{margin:0; text-align:center; font-size:24px; font-weight:800; letter-spacing:.2px}
  .auth-card .lead{text-align:center; margin:4px 0 18px}
  .auth-card .field:last-child{margin-bottom:0}
  .pw{position:relative}
  .pw input{padding-right:58px}
  .pw .eye{position:absolute; right:6px; top:50%; transform:translateY(-50%); border:none; background:none; cursor:pointer; color:var(--blue-d); font:inherit; font-size:12px; font-weight:800; padding:6px 8px; border-radius:8px}
  .pw .eye:hover{background:#eef2fb}
  .auth-msg{margin-top:12px; border-radius:11px; padding:10px 12px; font-size:13px; font-weight:700; line-height:1.35}
  .auth-msg.err{background:#fdecef; color:#c23b5e}
  .auth-msg.ok{background:#e6f6ee; color:#2f8a5e}
  .auth-card .btn{margin-top:16px}
  .auth-links{display:flex; justify-content:space-between; gap:10px; margin-top:14px}
  .auth-links button{border:none; background:none; cursor:pointer; font:inherit; font-size:13px; font-weight:800; color:var(--blue-d); padding:4px 0}
  .auth-links button:hover{text-decoration:underline}
  .auth-links.center{justify-content:center}
  .auth-alias{margin:14px 0 4px; text-align:center; background:linear-gradient(135deg,#eaf0fe,#f6edf8); border-radius:16px; padding:20px 14px}
  .auth-alias .big{font-size:32px; font-weight:800; margin:6px 0 4px; color:var(--ink)}
  .auth-foot{text-align:center; margin-top:18px; font-size:11.5px; color:var(--muted); font-weight:600}

  /* Roles */
  .rolebadge{display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.4px; text-transform:uppercase; padding:2px 8px; border-radius:8px; vertical-align:middle}
  .rolebadge.admin{background:#e6eefb; color:#4d7fd6}
  .rolebadge.board{background:#f1e9fd; color:#7c5fd0}
  .verified{display:inline-block; font-size:11px; font-weight:800; color:#2e9b6a; background:#e4f6ec; border-radius:8px; padding:2px 7px; margin-left:6px}
  .unverified{display:inline-block; font-size:11px; font-weight:700; color:#c98b34; background:#fbf1e2; border-radius:8px; padding:2px 7px; margin-left:6px}
  .side .section{font-size:10.5px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); padding:6px 12px 2px}

  .mrow{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .mrow .ctl{margin-left:auto; display:flex; align-items:center; gap:6px; flex-wrap:wrap}
  .mrow select.lvl{padding:7px 10px; border:1.5px solid #e5e2f0; border-radius:10px; font:inherit; font-size:12.5px; font-weight:700; color:var(--ink); background:#fff}
  .mrow select.lvl:disabled{opacity:.6}
  .mrow .mini{border:1px solid #dbe3f7; background:#fff; color:var(--blue-d); border-radius:10px; padding:7px 10px; font:inherit; font-size:12.5px; font-weight:800; cursor:pointer}
  .mrow .mini.danger{color:#c23b5e; border-color:#f5d3dc}
  .mrow .mini:hover{background:#eef3fe}
  .mrow .mini.danger:hover{background:#fdecef}
  .medit{display:flex; gap:8px; flex-wrap:wrap; width:100%; margin-top:8px}
  .medit input,.medit select{padding:9px 11px; border:1.5px solid #e5e2f0; border-radius:10px; font:inherit; font-size:13.5px; background:#fff}
  .mrow .info{min-width:0; flex:1 1 220px}
  @media (max-width:640px){
    .mrow .ctl{flex-basis:100%; margin-left:0; padding-left:56px}
  }

  /* Home: this week at a glance, and the two session columns */
  .week{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
  .wday{background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px 6px 7px; min-height:86px; cursor:pointer; text-align:center; font:inherit; color:var(--ink); display:flex; flex-direction:column; gap:4px; min-width:0}
  .wday:hover{border-color:#cdd7f3}
  .wday .dn{font-size:10px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--muted)}
  .wday .dd{font-size:16px; font-weight:800; width:28px; height:28px; line-height:28px; border-radius:50%; margin:0 auto}
  .wday.today .dd{background:var(--blue-d); color:#fff}
  .wday.past{opacity:.6}
  .wday .wi{font-size:10px; font-weight:700; padding:2px 5px; border-radius:6px; background:#f2f0fb; border-left:3px solid var(--c); text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .wday .wi.sess{background:#e4f6ec}
  .wday .wi.pend{background:#fbf1e2}
  .wday .wi.busy{background:#fdecef; color:#c23b5e; border-left-color:#e7a1b3}
  .wday .wi.free{background:#e4f6ec; color:#2e9b6a; border-left-color:#9fd8b9}
  .wday .more{font-size:9.5px; color:var(--muted); font-weight:700}
  .sessrow{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line)}
  .sessrow:last-child{border-bottom:none}
  .sessrow .when{font-size:11px; font-weight:800; color:var(--blue-d); background:#eef3fe; border-radius:8px; padding:3px 7px; white-space:nowrap}
  .sessrow .who{font-weight:800; font-size:14px}
  .sessrow .meta{font-size:12px; color:var(--muted); font-weight:600}
  @media (max-width:600px){
    .wday{min-height:60px; padding:6px 3px}
    .wday .wi{font-size:0; height:6px; padding:0; border-left:none; background:var(--c)}
    .wday .more{display:none}
  }

  .sections{display:flex; gap:6px; background:#eef0f6; padding:4px; border-radius:12px; margin:12px 0 4px}
  .sections button{flex:1; border:0; background:transparent; padding:9px 0; border-radius:9px; font:inherit; font-size:13.5px; font-weight:800; color:#6b7088; cursor:pointer}
  .sections button.on{background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(20,25,40,.14)}

function toggleMenu(v){ menuOpen = v===undefined ? !menuOpen : v; renderNav(); }

// Top-level posts for a class, each with its replies, oldest reply first.
function postsFor(course, groupId){

  const inGroup = p => groupId===undefined ? true : groupId===null ? !p.group_id : p.group_id===groupId;
  return all.filter(p => p.course===course && !p.parent_id && inGroup(p)).map(p => ({
    id:p.id, who:p.author_alias, txt:p.body, mine:p.author_id===me, urgent:!!p.urgent,
    replies: all.filter(r => r.parent_id===p.id).sort((a,b)=>a.created_at.localeCompare(b.created_at)).map(r => ({ who:r.author_alias, txt:r.body })),

  }));

/* ============================= RENDER ============================= */
// Re-drawing must not move the page. Only navigation (go, openView, closeView,
// a new setup step) asks for the top, by setting S._top before render.
function render(){
  const y = window.scrollY;
  try { renderInner(); }
  catch(e){
    // A rendering bug must never leave an empty screen.
    console.error(e);
    const c = document.getElementById('scroll');
    if(c) c.innerHTML = '<div class="card" style="margin:24px auto;max-width:520px;text-align:center"><div style="font-size:34px">😵</div><div style="font-weight:800;margin:6px 0">Something went wrong on this screen</div><div class="tiny" style="margin-bottom:12px">' + esc(String(e && e.message || e)) + '</div><div class="row" style="gap:8px;justify-content:center"><button class="btn sm gray" onclick="S.overlay=null;S.tab=\'home\';render()">Go home</button><button class="btn sm" onclick="location.reload()">Reload</button></div></div>';
  }
  if(S._top){ S._top = false; window.scrollTo(0,0); }
  else { window.scrollTo(0, y); requestAnimationFrame(function(){ window.scrollTo(0, y); }); }
}
function renderInner(){
  // Nothing in the app renders until you're signed in. Names, grades and
  // requests all belong to somebody, so there's no sensible signed-out view.
  // Sign-in is parked for now (SKIP_LOGIN) — everyone lands on a demo profile.
  if(!A.profile && SKIP_LOGIN) useDemoProfile();
  document.getElementById('app').classList.toggle('auth', !A.profile);
  if(!A.profile){
    document.getElementById('head').innerHTML = '';
    document.getElementById('nav').innerHTML  = '';
    renderAuth();
    return;
  }
  if(!dataLoaded){
    if(!dataLoading && !dataError){ dataLoading = true; loadData().then(function(){ dataLoading=false; render(); }).catch(function(e){ dataLoading=false; dataError = e.message || 'Could not load your data'; render(); }); }
    document.getElementById('head').innerHTML = '';
    document.getElementById('nav').innerHTML  = '';
    document.getElementById('scroll').innerHTML = dataError
      ? '<div class="card" style="margin:60px auto;max-width:480px;text-align:center"><div style="font-size:34px">📡</div><div style="font-weight:800;margin:6px 0">Could not load your SilverCircle</div><div class="tiny" style="margin-bottom:12px">' + esc(dataError) + '</div><div class="row" style="gap:8px;justify-content:center"><button class="btn sm" onclick="dataError=null;render()">Try again</button><button class="btn sm gray" onclick="logOut()">Log out</button></div></div>'
      : '<div class="empty" style="padding-top:80px"><div class="em">📚</div>Loading your SilverCircle…</div>';
    return;
  }
  if((!A.profile.onboarded_at || S.setupForce) && !isAdmin()){
    document.getElementById('app').classList.add('auth');
    document.getElementById('head').innerHTML = ''; document.getElementById('nav').innerHTML = '';
    renderSetup(document.getElementById('scroll'));
    return;
  }
  renderHead(); renderBody(); renderNav(); save();
}

let menuOpen = false;
const TAB_TITLES = { settings:'Settings', help:'Help', home:'Home Screen', classes:'Classes', calendar:'Calendar', tutoring:'Tutoring', community:'Community', profile:'Profile', 'admin-grades':'People to check', 'admin-requests':'All requests', 'admin-team':'Members', 'admin-times':'Session times', admin:'Administration' };
const isStaff = () => !!(A.profile && (A.profile.role==='admin' || A.profile.role==='board'));
const hasGrade = () => !!(A.profile && A.profile.role==='student');   // staff accounts carry no grade
// Administrators run the program; they are neither tutors nor tutees. No
// survey, no tutor/tutee switch, and their work sits on the tabs. The board
// keeps the student experience plus the hub button.
const isAdmin = () => !!(A.profile && A.profile.role==='admin');
// Everyone but an administrator has classes: students and board members.
const hasSchedule = () => !!(A.profile && !isAdmin());
const roleBadge = r => r==='admin' ? '<span class="rolebadge admin">Administrator</span>' : r==='board' ? '<span class="rolebadge board">Board</span>' : '';
function renderHead(){
  const title = S.overlay?.type==='course' ? S.overlay.course : TAB_TITLES[S.tab] || 'SilverCircle';
  // A redraw while someone is typing an issue keeps what they typed.
  const draft = $('issue_in') ? $('issue_in').value : null, typing = document.activeElement && document.activeElement.id==='issue_in';
  setTimeout(()=>{ const t=$('issue_in'); if(t && draft!==null){ t.value=draft; if(typing) t.focus(); } }, 0);
  $('head').innerHTML = `

    ${bellHtml()}${issueBtnHtml()}`;
}
// The ! in the top right, on every screen. Anyone can tell the board and
// administrators something is broken; staff see the open ones here and mark
// them fixed. Stored in sl_reports with no post or message attached.
const isIssue = r => !r.post_id && !r.message_id;
function openIssues(){ return isStaff() ? (S.reports||[]).filter(r=>r.status==='open' && isIssue(r)) : []; }
function issueBtnHtml(){
  const open=openIssues();
  return `<button class="bell issuebtn" onclick="toggleIssues()" aria-label="Report an issue" title="Report an issue">!${open.length?`<span class="n">${open.length>9?'9+':open.length}</span>`:''}</button>
    ${S.issueOpen ? `<div class="nscrim" onclick="toggleIssues(false)"></div><div class="notifs issues">
      <div class="nh">Report an issue</div>
      <div style="padding:10px 14px">
        <textarea id="issue_in" rows="3" maxlength="1000" placeholder="What went wrong? What were you trying to do?"></textarea>
        <div class="row" style="gap:8px;margin-top:8px"><span class="tiny" style="flex:1">The board and administrators see this. We include the page you're on.</span><button class="btn sm" id="issue_send" onclick="sendIssue()">Send</button></div>
      </div>
      ${isStaff() ? `<div class="nh" style="border-top:1px solid var(--line)">Open issues ${open.length?`<span class="count">${open.length}</span>`:''}</div>
        ${open.length ? open.map(r=>`<div class="nrow" style="cursor:default;align-items:flex-start"><span class="ic">❗</span><div style="min-width:0;flex:1">
            <div class="t" style="white-space:normal">${esc(r.reason||'(no details)')}</div>
            <div class="s">${esc(r.snapshot||'')}${r.created_at?' · '+agoLabel(r.created_at):''}</div></div>
            <button class="btn sm ghost" style="flex:0 0 auto" onclick="resolveIssue('${r.id}')">Fixed</button></div>`).join('')
          : '<div class="tiny" style="padding:14px;text-align:center">No open issues.</div>'}` : ''}
    </div>` : ''}`;
}
function toggleIssues(open){ S.issueOpen = open===undefined ? !S.issueOpen : open; S.notifOpen=false; renderHead(); if(S.issueOpen){ const t=$('issue_in'); if(t) t.focus(); } }
function sendIssue(){
  const t=$('issue_in'), text=(t&&t.value||'').trim(); if(!text){ toast('Say what went wrong first.'); return; }
  const page=(S.overlay ? (S.overlay.type==='course' ? S.overlay.course : S.overlay.type) : (TAB_TITLES[S.tab]||S.tab||'Home'));
  const device=/iPhone|iPad/.test(navigator.userAgent)?'iPhone/iPad':/Android/.test(navigator.userAgent)?'Android':/Mac/.test(navigator.userAgent)?'Mac':/Windows/.test(navigator.userAgent)?'Windows':/CrOS/.test(navigator.userAgent)?'Chromebook':'Other device';
  const btn=$('issue_send'); if(btn){ btn.disabled=true; btn.textContent='Sending…'; }
  sbFetch('/rest/v1/sl_reports', { method:'POST', headers:{ Prefer:'return=minimal' }, body:JSON.stringify({ reporter_id:A.user.id, reason:text, snapshot:('From '+currentAlias()+' · on '+page+' · '+device).slice(0,500) }) })
    .then(()=>{ S.issueOpen=false; toast('Sent — thanks! The board will take a look.'); return isStaff() ? loadData() : null; })
    .then(()=>render())
    .catch(e=>{ toast(e.message); if(btn){ btn.disabled=false; btn.textContent='Send'; } });
}
function resolveIssue(id){
  S.reports=(S.reports||[]).filter(r=>r.id!==id); renderHead();
  sbFetch('/rest/v1/sl_reports?id=eq.'+id, { method:'PATCH', headers:{ Prefer:'return=minimal' }, body:JSON.stringify({ status:'resolved' }) })
    .then(()=>toast('Marked fixed')).catch(e=>{ toast(e.message); loadData().then(render); });
}

// ---- Notifications: what changed for you, built from what is already loaded ----
// Requests moving, offers, replies to your posts, chat messages, grade checks.
// Nothing new is stored on the server; "read" lives on this device.
const NOTIF_LS = 'sc-notif-seen';
function notifSeen(){ try { return JSON.parse(localStorage.getItem(NOTIF_LS)||'{}'); } catch { return {}; } }
function notifMarkAll(items){ const seen=notifSeen(); const cut=Date.now()-30*86400000; Object.keys(seen).forEach(k=>{ if(seen[k]<cut) delete seen[k]; }); items.forEach(n=>{ seen[n.key]=Date.now(); }); try { localStorage.setItem(NOTIF_LS, JSON.stringify(seen)); } catch {} }
function notifItems(){
  const me=A.user ? A.user.id : null, out=[], cut=new Date(Date.now()-14*86400000).toISOString();
  const when = r => r.done_at || r.created_at || '';
  // Requests I made
  (S.myRequests||[]).forEach(r=>{
    if(r.status==='offered') out.push({ key:'req:'+r.id+':offered', at:when(r), ic:'🤝', t:(r.tutor_alias||'A tutor')+' offered to help with '+r.course, s:fmtDate(r.date)+(r.time?' · '+r.time:''), go:()=>go('tutoring') });
    if(r.status==='accepted') out.push({ key:'req:'+r.id+':accepted', at:when(r), ic:'✅', t:'Session confirmed with '+(r.tutor_alias||'your tutor'), s:r.course+' · '+fmtDate(r.date)+(r.time?' · '+r.time:''), go:()=>go('tutoring') });
    if(r.status==='declined') out.push({ key:'req:'+r.id+':declined', at:when(r), ic:'↩️', t:(r.tutor_alias||'The tutor')+' can\'t do '+r.course+' then', s:'Try another time or tutor', go:()=>go('tutoring') });
    if(r.status==='cancelled') out.push({ key:'req:'+r.id+':cancelled', at:when(r), ic:'✕', t:r.course+' session cancelled', s:fmtDate(r.date), go:()=>go('tutoring') });
  });
  // Requests to me
  (S.incoming||[]).forEach(r=>{
    if(r.status==='pending') out.push({ key:'req:'+r.id+':pending', at:when(r), ic:'📬', t:(r.student_alias||'A student')+' asked for '+r.course, s:fmtDate(r.date)+' · '+(splitOptions(r.time).length>1 ? splitOptions(r.time).length+' times to pick from' : (r.time||'')), go:()=>go('tutoring') });
    if(r.status==='accepted') out.push({ key:'req:'+r.id+':accepted', at:when(r), ic:'✅', t:(r.student_alias||'A student')+' confirmed '+r.course, s:fmtDate(r.date)+(r.time?' · '+r.time:''), go:()=>go('tutoring') });
    if(r.status==='cancelled') out.push({ key:'req:'+r.id+':cancelled', at:when(r), ic:'✕', t:r.course+' with '+(r.student_alias||'a student')+' cancelled', s:fmtDate(r.date), go:()=>go('tutoring') });
  });
  // Replies to my posts
  const mine=new Set((S.posts||[]).filter(p=>p.author_id===me).map(p=>p.id));
  (S.posts||[]).filter(p=>p.parent_id && mine.has(p.parent_id) && p.author_id!==me && p.created_at>cut)
    .forEach(p=>out.push({ key:'reply:'+p.id, at:p.created_at, ic:'💬', t:(p.author_alias||'Someone')+' replied in '+p.course, s:(p.body||'').slice(0,80), go:()=>openView({type:'board',course:p.course}) }));
  // Chat messages to me
  (S.inbox||[]).filter(m=>m.sender_id!==me && m.created_at>cut).forEach(m=>{ const r=findReq(m.request_id); if(!r) return;
    out.push({ key:'msg:'+m.id, at:m.created_at, ic:'✉️', t:'Message from '+otherSide(r).alias, s:(m.body||'').slice(0,80), go:()=>openView({type:'chat', id:r.id}) }); });
  // Sessions to rate
  if(!isAdmin() && !ratingPromptsOff()) unratedSessions().slice(0,3).forEach(r=>out.push({ key:'rate:'+r.id, at:r.done_at||r.created_at, ic:'⭐', t:'Rate your '+r.course+' session with '+(r.tutor_alias||'your tutor'), s:'Optional · only administrators see it', go:()=>openView({type:'rate', id:r.id}) }));
  // Study groups waiting on me, or opened for me
  (S.groups||[]).forEach(g=>{
    if(g.status==='pending' && g.tutor_id===me) out.push({ key:'group:'+g.id+':ask', at:g.created_at, ic:'📚', t:(g.creator_alias||'A student')+' wants you to supervise a study group', s:g.name+' · '+g.course, go:()=>openView({type:'groupChat', id:g.id}) });
    if(canApprove(g,me)) groupAsks(g.id).forEach(m=>out.push({ key:'group:'+g.id+':ask:'+m.user_id, at:m.joined_at, ic:'🙋', t:(m.alias||'Someone')+' asked to join '+g.name, s:g.course+' · approve or decline', go:()=>openView({type:'groupChat', id:g.id}) }));
    if(g.status==='active' && groupMembers(g.id).some(m=>m.user_id===me && m.user_id!==g.created_by)) out.push({ key:'group:'+g.id+':in', at:(groupMembers(g.id).find(m=>m.user_id===me)||{}).joined_at||g.created_at, ic:'📚', t:'You\'re in '+g.name, s:g.course+' · supervised by '+(g.tutor_alias||'a tutor'), go:()=>openView({type:'groupChat', id:g.id}) });
    if(g.status==='active' && g.created_by===me && g.tutor_id!==me) out.push({ key:'group:'+g.id+':open', at:g.created_at, ic:'📚', t:(g.tutor_alias||'The tutor')+' opened your study group', s:g.name+' · '+g.course, go:()=>openView({type:'groupChat', id:g.id}) });
  });
  // My grade checks
  (S.taken||[]).forEach(g=>{
    if(g.status==='verified') out.push({ key:'grade:'+g.id+':verified', at:g.reviewed_at||g.created_at||'', ic:'🎓', t:g.course+' verified — you can tutor it', s:'Grade '+(g.grade||''), go:()=>go('profile') });
    if(g.status==='rejected') out.push({ key:'grade:'+g.id+':rejected', at:g.reviewed_at||g.created_at||'', ic:'⚠️', t:g.course+' grade wasn\'t verified', s:'Check it on your profile', go:()=>go('profile') });
  });
  // Staff: people waiting on a grade check
  if(isStaff()) (S.reports||[]).filter(r=>r.status==='open' && !isIssue(r)).forEach(r=>out.push({ key:'report:'+r.id, at:r.created_at, ic:'🚩', t:'A message was reported', s:(r.snapshot||'').slice(0,80), go:()=>go('home') }));
  if(isStaff() && S.pendingGrades) out.push({ key:'admin:pending:'+S.pendingGrades, at:new Date().toISOString(), ic:'✅', t:S.pendingGrades+' '+(S.pendingGrades===1?'person':'people')+' waiting on a grade check', s:'Tap to review', go:()=>go('admin-grades') });
  const seen=notifSeen();
  out.forEach(n=>{ n.unread=!seen[n.key]; });
  return out.sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,40);
}
// "just now", "12 min ago", "yesterday"
function agoLabel(ts){ const d=(Date.now()-new Date(ts).getTime())/60000; if(!(d>=0)) return ''; if(d<1) return 'just now'; if(d<60) return Math.round(d)+' min ago'; if(d<36*60) return Math.round(d/60)+' h ago'; if(d<48*60) return 'yesterday'; return Math.round(d/1440)+' days ago'; }
function bellHtml(){
  const items=notifItems(), unread=items.filter(n=>n.unread).length;
  return `<button class="bell" onclick="toggleNotifs()" aria-label="Notifications">🔔${unread?`<span class="n">${unread>9?'9+':unread}</span>`:''}</button>
    ${S.notifOpen ? `<div class="nscrim" onclick="toggleNotifs(false)"></div><div class="notifs">
      <div class="nh">Notifications ${unread?`<span class="count">${unread}</span>`:''}<button onclick="notifMarkAll(notifItems());render()">Mark all read</button></div>
      ${items.length ? items.map((n,i)=>`<button class="nrow ${n.unread?'unread':''}" onclick="notifOpen(${i})"><span class="ic">${n.ic}</span><div style="min-width:0;flex:1"><div class="t">${esc(n.t)}</div><div class="s">${esc(n.s)}${n.at?' · '+esc(agoLabel(n.at)):''}</div></div>${n.unread?'<span class="dot"></span>':''}</button>`).join('')
        : '<div class="tiny" style="padding:18px;text-align:center">Nothing yet. Requests, replies and messages show up here.</div>'}
    </div>` : ''}`;
}

function notifOpen(i){ const n=notifItems()[i]; if(!n) return; const seen=notifSeen(); seen[n.key]=Date.now(); try { localStorage.setItem(NOTIF_LS, JSON.stringify(seen)); } catch {} S.notifOpen=false; n.go(); }

function renderBody(){
  const c=$('scroll'); if(!['admin-grades','admin-requests','admin-team'].includes(S.tab) || S.overlay) c.dataset.page = '';
  if(isAdmin() && (S.tab==='tutoring' || S.tab==='admin')) S.tab='home';
  if(S.overlay) return renderOverlay(c);
  if(S.tab==='home') return isAdmin() ? renderAdminHome(c) : renderHome(c);
  if(S.tab==='classes') return renderClasses(c);

// The school's week in four numbers: sessions held, sessions booked, new
// requests, new posts. Each opens the tab with the detail.
function weekPulseHtml(){
  const since = new Date(Date.now()-7*86400000).toISOString();
  const all = S.allRequests||[];
  const held = all.filter(r=>r.status==='done' && (r.done_at||r.created_at)>=since).length;
  const booked = all.filter(r=>r.status==='accepted').length;
  const asked = all.filter(r=>r.created_at>=since).length;
  const posted = (S.posts||[]).filter(p=>p.created_at>=since).length;
  const tile = (tab, n, label, color) => `<div class="stat" style="cursor:pointer" onclick="go('${tab}')"><div class="n" style="color:${color}">${n}</div><div class="l">${label}</div></div>`;
  return `<div class="statgrid" style="grid-template-columns:repeat(4,1fr)">
    ${tile('admin-requests', held, 'sessions held', 'var(--green)')}
    ${tile('calendar', booked, 'booked ahead', 'var(--blue-d)')}
    ${tile('admin-requests', asked, 'new requests', 'var(--purple)')}
    ${tile('community', posted, 'new posts', 'var(--pink-d)')}
  </div>`;
}
// The week as seven squares: how many tutors have marked themselves free that
// day, and how many sessions are booked. A square opens that day on the calendar.
function adminWeekHtml(){
  const now=new Date(), today=ymd(now);
  const start=addDays(now, -now.getDay());
  const tutors=(S.tutors||[]).filter(t=>!adminIds().has(t.id));
  const sessions=(S.allRequests||[]).filter(r=>r.status==='accepted' && r.date);
  let cells='';
  for(let i=0;i<7;i++){
    const d=addDays(start,i), k=ymd(d);
    const free=tutors.filter(t=>{ const b=blocksOn(t.id,k); return b.some(x=>x.kind==='available') && !b.some(x=>x.kind==='unavailable' && x.start_min===0 && x.end_min===1440); }).length;
    const booked=new Set(sessions.filter(r=>r.date===k).map(r=>r.student_id)).size;
    cells += `<button class="wday ${k===today?'today':''} ${k<today?'past':''}" onclick="openView({type:'adminDay',date:'${k}'})" title="${esc(fmtDate(k))}">
      <span class="dn">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][i]}</span>
      <span class="dd">${d.getDate()}</span>
      <span class="wi free" style="--c:var(--green)">${free} tutor${free===1?'':'s'} free</span>
      ${booked ? `<span class="wi sess" style="--c:var(--blue-d)">${booked} student${booked===1?'':'s'}</span>` : ''}
    </button>`;
  }
  return `<div class="week">${cells}</div>`;
}

// When I'm actually free on a day, between 7 AM and 8 PM: inside any
// "available" windows I set, minus busy times and class periods.
function freeWindows(userId, k){
  const blocks=blocksOn(userId, k);
  const avail=blocks.filter(b=>b.kind==='available');
  let free = avail.length ? avail.map(b=>[Math.max(b.start_min,420), Math.min(b.end_min,1200)]) : [[420,1200]];
  const cut=[...blocks.filter(b=>b.kind==='unavailable'), ...classesOn(userId, k)];
  cut.forEach(b=>{ free = free.flatMap(([a,z])=> b.end_min<=a || b.start_min>=z ? [[a,z]] : [[a,b.start_min],[b.end_min,z]]); });
  return free.filter(([a,z])=>z-a>=15).sort((x,y)=>x[0]-y[0]);
}
// "7–8a", "10:40a–8p": short enough to fit a small square.
function tinyRange(a,b){
  const t = m => { const h=Math.floor(m/60)%24, mm=m%60; return ((h+11)%12+1)+(mm?':'+String(mm).padStart(2,'0'):''); };
  const ap = m => Math.floor(m/60)%24<12 ? 'a' : 'p';
  return ap(a)===ap(b) ? t(a)+'–'+t(b)+ap(b) : t(a)+ap(a)+'–'+t(b)+ap(b);
}
// Today to Saturday, one small square per day.
function weekFreeHtml(){
  const now=new Date(), rows=[];
  for(let i=0; i<=6-now.getDay(); i++){
    const k=ymd(addDays(now,i)), nowMin=Math.ceil((now.getHours()*60+now.getMinutes())/15)*15;
    const w=freeWindows(A.user.id, k).map(([a,z])=> i===0 ? [Math.max(a,nowMin),z] : [a,z]).filter(([a,z])=>z-a>=15);
    rows.push(`<button class="freesq ${w.length?'':'none'} ${i===0?'today':''}" title="${esc(fmtDate(k))}" onclick="S.cal={y:${addDays(now,i).getFullYear()},m:${addDays(now,i).getMonth()},sel:'${k}'}; go('calendar')">
      <span class="d">${i===0?'Today':esc(parseYmd(k).toLocaleDateString(undefined,{weekday:'short'}))}</span>
      ${w.length ? w.map(([a,z])=>`<span class="t">${esc(tinyRange(a,z))}</span>`).join('') : '<span class="t">—</span>'}
    </button>`);
  }
  return `<div class="freesqs">${rows.join('')}</div>`;
}
// "Away this week": one-time all-day unavailable blocks from today to Saturday.
function awayBlocks(){
  const today=ymd(new Date()), end=ymd(addDays(new Date(), 6-new Date().getDay()));
  return (S.availability||[]).filter(b=>b.user_id===A.user.id && !b.recurring && b.kind==='unavailable' && b.note==='Away this week' && b.date>=today && b.date<=end);
}
function toggleAwayWeek(){
  const have=awayBlocks();
  if(have.length){
    sbFetch('/rest/v1/sl_availability?id=in.('+have.map(b=>b.id).join(',')+')', { method:'DELETE', headers:{ Prefer:'return=minimal' } })
      .then(loadData).then(function(){ toast('You\'re available again'); render(); }).catch(function(e){ toast(e.message); });
    return;
  }
  const rows=[]; const d0=new Date(); const n=6-d0.getDay();
  for(let i=0;i<=n;i++) rows.push({ user_id:A.user.id, kind:'unavailable', recurring:false, date:ymd(addDays(d0,i)), start_min:0, end_min:1440, note:'Away this week' });
  sbFetch('/rest/v1/sl_availability', { method:'POST', headers:{ Prefer:'return=minimal' }, body:JSON.stringify(rows) })
    .then(loadData).then(function(){ toast('Marked away through Saturday'); render(); }).catch(function(e){ toast(e.message); });
}

// Everything on one day, in time order: all-day busy first, then timed things
// (events, sessions, busy or free times), then events with no time.
const shortTime = m => minLabel(m).replace(':00 ',' ');
function timeRange(a,b){
  const A=shortTime(a), B=shortTime(b);
  return A.slice(-2)===B.slice(-2) ? A.slice(0,-3)+'–'+B : A+'–'+B;
}
function dayEntries(k){
  const out=[];
  calItems().filter(e=>e.date===k).forEach(e=>{
    const m=slotMin(e.time);
    out.push({ min: m===null ? 2000 : m, text:(m===null ? '' : shortTime(m)+' ')+(e.kind==='session' ? e.title.replace(/^(Tutoring|Session with) /,'🤝 ') : e.title), kind:e.kind, color:courseColor(e.course) });
  });
  if(A.user) blocksOn(A.user.id, k).forEach(b=>{
    const all=b.start_min===0 && b.end_min===1440;
    const word=b.kind==='available' ? 'Free' : (b.note && b.note!=='Away this week' ? b.note : 'Busy');
    out.push({ min: all ? -1 : b.start_min, text: word+' '+(all ? 'all day' : timeRange(b.start_min, b.end_min)), kind: b.kind==='available' ? 'free' : 'busy' });
  });
  return out.sort((a,b)=>a.min-b.min);
}

// Sunday to Saturday of the current week, with sessions, requests and events on
// each day. Tapping a day opens the calendar there.
function weekStrip(){
  const now=new Date(), today=ymd(now);
  const start=addDays(now, -now.getDay());
  const items=calItems();
  let cells='';
  for(let i=0;i<7;i++){
    const d=addDays(start,i), k=ymd(d);
    const evs=dayEntries(k);
    cells += `<button class="wday ${k===today?'today':''} ${k<today?'past':''}" onclick="S.cal={y:${d.getFullYear()},m:${d.getMonth()},sel:'${k}'}; go('calendar')" title="${esc(fmtDate(k))}">
      <span class="dn">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][i]}</span>
      <span class="dd">${d.getDate()}</span>
      ${evs.slice(0,4).map(e=>`<span class="wi ${e.kind==='session'?'sess':e.kind==='pending'?'pend':e.kind==='busy'?'busy':e.kind==='free'?'free':''}" style="--c:${e.color||'transparent'}">${esc(e.text)}</span>`).join('')}
      ${evs.length>4?`<span class="more">+${evs.length-4} more</span>`:''}
    </button>`;
  }
  return `<div class="week">${cells}</div>`;
}

// Sessions belong to one student each. Lists show one card per student
// (classes, how many sessions, the next one); tapping it opens that student's
// sessions, each with its own chat, plan, Done and cancel.
function sessionsByStudent(rows){
  const by={};
  rows.forEach(r=>{ (by[r.student_id]=by[r.student_id]||[]).push(r); });
  const today=ymd(new Date());
  return Object.entries(by).map(([id,list])=>{
    list.sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||(a.time||'').localeCompare(b.time||''));
    const next=list.find(r=>r.date && r.date>=today && r.status==='accepted') || list.find(r=>r.status==='accepted') || list[0];
    return { id, alias:list[0].student_alias||'Student', list, next, courses:[...new Set(list.map(r=>r.course))] };
  }).sort((a,b)=>(a.next?.date||'9999').localeCompare(b.next?.date||'9999'));
}

function toggleClass(course){

  render();
  saveClass(course, !had);
}
// The class lists are written straight through; a failure reloads from the server.
function saveClass(course, add){
  const me=A.user.id, tutor=S.mode==='tutor';
  const table = tutor ? 'sl_tutor_courses' : 'sl_student_classes';
  const p = add
    ? sbFetch('/rest/v1/'+table, { method:'POST', headers:{ Prefer:'return=minimal,resolution=ignore-duplicates' }, body:JSON.stringify(tutor ? { user_id:me, course, availability:S.me.avail||'' } : { user_id:me, course }) })
    : sbFetch('/rest/v1/'+table+'?user_id=eq.'+me+'&'+courseIn(course), { method:'DELETE', headers:{ Prefer:'return=minimal' } });
  p.then(function(){ if(tutor) return loadData().then(render); }).catch(function(e){ toast(e.message); loadData().then(render); });
}
function removeClass(course){
  S[classKey()]=S[classKey()].filter(x=>x!==course);
  render(); toast('Removed '+course);
  saveClass(course, false);
}

const EVENT_KINDS = { test:'📝 Test', homework:'📚 Homework', study:'📖 Study', other:'📌 Other', session:'🤝 Tutoring', pending:'⏳ Waiting for an answer', offer:'📨 Offer · answer in Tutoring' };
// Everything with a date: my own events, booked sessions, and requests still waiting.
function calItems(){

  if(isAdmin()) return [
    ...S.events,
    ...(S.allRequests||[]).filter(r=>r.date && r.status==='accepted').map(r=>({ id:r.id, date:r.date, time:r.time, course:r.course, kind:'session', title:(r.student_alias||'Student')+' with '+(r.tutor_alias||'Tutor'), color:courseColor(r.course) })),
  ];
  return [
    ...S.events,
    ...sessionsList().filter(x=>x.date).map(x=>({ id:x.id, date:x.date, time:x.time, course:x.course, kind:'session', title:(x.role==='tutor'?'Tutoring ':'Session with ')+x.with, cancel:'session' })),
    ...S.myRequests.filter(r=>r.date && r.status==='pending').map(r=>({ id:r.id, date:r.date, time:r.time, course:r.course, kind:'pending', title:'Waiting on '+r.tutor_alias, cancel:'request' })),
    ...S.incoming.filter(r=>r.date && r.status==='offered').map(r=>({ id:r.id, date:r.date, time:r.time, course:r.course, kind:'pending', title:'Offered to '+r.student_alias, cancel:'offer' })),
    ...S.myRequests.filter(r=>r.date && r.status==='offered').map(r=>({ id:r.id, date:r.date, time:r.time, course:r.course, kind:'offer', title:r.tutor_alias+' wants to meet', fixed:true })),

const byWhen = (a,b) => a.date.localeCompare(b.date) || (a.time||'').localeCompare(b.time||'');
function eventRow(e){
  return `<div class="evrow" style="--c:${courseColor(e.course)}">
    <div class="bar"></div>
    <div style="min-width:0">
      <div style="font-weight:800;font-size:14px">${esc(e.title)}</div>
      <div class="tiny">${esc(fmtDate(e.date))}${e.time?' · '+esc(e.time):''} · ${EVENT_KINDS[e.kind]||''}${e.course?' · '+esc(e.course):''}</div>
    </div>
    ${e.cancel ? cancelBtn(e.id, e.cancel) : e.fixed ? '' : `<button class="del" title="Delete" onclick="deleteEvent('${e.id}')">✕</button>`}
  </div>`;
}
function renderCalendar(c){
  const now=new Date();
  S.cal = S.cal || { y:now.getFullYear(), m:now.getMonth(), sel:ymd(now) };
  const { y, m, sel } = S.cal;
  const first = new Date(y, m, 1);
  const start = addDays(first, -first.getDay());
  const items = calItems();
  const today = ymd(now);
  let cells='';
  for(let i=0;i<42;i++){
    const d=addDays(start,i), k=ymd(d);
    if(i>=35 && d.getMonth()!==m) break;   // drop a sixth row that is all next month
    const evs=items.filter(e=>e.date===k).sort(byWhen);
    const myBlocks=blocksOn(A.user.id, k);
    const allBusy=myBlocks.some(b=>b.kind==='unavailable' && b.start_min===0 && b.end_min===1440);
    const anyBusy=myBlocks.some(b=>b.kind==='unavailable'), anyFree=myBlocks.some(b=>b.kind==='available');
    cells += `<div class="day ${d.getMonth()!==m?'out':''} ${k===today?'today':''} ${k===S.cal.open?'sel':''} ${allBusy?'busy':anyFree&&!anyBusy?'free':''}" role="button" tabindex="0" onclick="openDay('${k}')" onkeydown="if(event.key==='Enter')openDay('${k}')">
      <span class="n">${d.getDate()}</span>
      <button class="plus" title="Add to ${esc(fmtDate(k))}" aria-label="Add to ${esc(fmtDate(k))}" onclick="event.stopPropagation(); openDay('${k}')">+</button>
      ${dayEntries(k).slice(0,3).map(e=>`<div class="ev ${e.kind==='busy'?'busyev':e.kind==='free'?'freeev':''}" style="--c:${e.color||'transparent'}">${esc(e.text)}</div>`).join('')}
      ${dayEntries(k).length>3?`<div class="more">+${dayEntries(k).length-3} more</div>`:''}
    </div>`;
  }
  c.innerHTML = `
    <div class="calhead">
      <h3>${MONTHS[m]} ${y}</h3>
      <button onclick="calMove(-1)" aria-label="Previous month">‹</button>
      <button onclick="S.cal={y:${now.getFullYear()},m:${now.getMonth()},sel:'${today}'}; render()">Today</button>
      <button onclick="calMove(1)" aria-label="Next month">›</button>
    </div>
    <div class="cal">
      ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dow">${d}</div>`).join('')}
      ${cells}
    </div>

    ${S.cal.open ? dayModalHtml(S.cal.open) : ''}
  `;
}
// One day, opened from its square: what's on it, and tabs to add more.
function openDay(k, tab){

  S.cal.tab = tab || 'pick';

}
function closeDay(){ S.cal.open=null; render(); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && S.cal && S.cal.open) closeDay(); });

        <div><div style="font-weight:800">${l}</div><div class="tiny">${sub}</div></div>

  } else if(t==='see'){
    body = `<div class="card">
      ${evs.length || blocks.length ? evs.map(eventRow).join('') + blocks.map(b=>`<div class="avrow">
          <span class="tag ${b.kind==='available'?'ok':'no'}">${b.kind==='available'?'Available':'Unavailable'}</span>
          <div style="min-width:0;flex:1"><div style="font-weight:800;font-size:13.5px">${esc(availLabel(b))}</div>${b.note?`<div class="tiny">${esc(b.note)}</div>`:''}${b.recurring?'<div class="tiny">Repeats weekly — removing it removes every week</div>':''}</div>
          <button class="del" title="Remove" style="border:none;background:none;color:var(--muted);cursor:pointer;font-size:16px" onclick="deleteAvail('${b.id}')">✕</button>
        </div>`).join('')
      : `<div class="tiny" style="text-align:center;padding:10px">Nothing on this day yet.</div>`}
    </div>`;
  } else if(t==='event'){
    body = `<div class="card">
      <div class="field"><label>What</label><input id="ev_title" placeholder="e.g. Unit 3 test" onkeydown="if(event.key==='Enter')addEvent()"></div>
      <div class="row" style="gap:10px">
        <div class="field" style="flex:1"><label>Type</label><select id="ev_kind">
          ${['test','homework','study','other'].map(x=>`<option value="${x}">${EVENT_KINDS[x]}</option>`).join('')}</select></div>
        <div class="field" style="flex:1"><label>Time</label><input id="ev_time" type="time"></div>
      </div>
      <div class="field"><label>Class</label><select id="ev_course">
        <option value="">No class</option>
        ${S[classKey()].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>
      <button class="btn" onclick="addEvent()">Add to calendar</button>
    </div>`;
  } else if(t==='avail'){
    body = `<div class="card">${availFormHtml(k)}</div>`;
  } else {
    body = `<div class="card" style="text-align:center">
      <div style="font-size:30px">🤝</div>
      <div class="tiny" style="margin:6px 0 12px">Pick a student, a time and a place. They get it in Tutoring, and once they accept it's on both calendars.</div>
      <button class="btn" onclick="S.cal.open=null; openView({type:'schedule', date:'${k}'})">Schedule tutoring on ${esc(fmtDate(k))}</button>
    </div>`;
  }
  return `<div class="dm-back" onclick="if(event.target===this)closeDay()">
    <div class="dm" role="dialog" aria-label="${esc(fmtDate(k))}">
      <div class="dmhead"><h3>${esc(parseYmd(k).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}))}</h3>
        <button onclick="closeDay()" aria-label="Close">✕</button></div>
      ${t==='pick' ? '' : `<button class="back" onclick="S.cal.tab='pick'; render()">‹ ${esc((choices.find(x=>x[0]===t)||[,,'Back'])[2])}</button>`}
      ${body}

function availFormHtml(sel){
  const f = S.availForm = S.availForm || { kind:'unavailable', recurring:false, weekdays:[parseYmd(sel).getDay()], allDay:true, start:'3:00 PM', end:'5:00 PM', note:'' };
  const slots = TIME_SLOTS;
  return `
    <div class="field"><label>I am</label>
      <div class="seg"><button class="${f.kind==='available'?'on':''}" onclick="S.availForm.kind='available';render()">Available</button><button class="${f.kind==='unavailable'?'on':''}" onclick="S.availForm.kind='unavailable';render()">Unavailable</button></div></div>
    <div class="field"><label>How often</label>
      <div class="seg"><button class="${!f.recurring?'on':''}" onclick="S.availForm.recurring=false;render()">Just ${esc(fmtDate(sel))}</button><button class="${f.recurring?'on':''}" onclick="S.availForm.recurring=true;render()">Every week</button></div></div>
    ${f.recurring ? `<div class="field"><label>On</label><div class="daychips">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((d,i)=>`<button class="${f.weekdays.includes(i)?'on':''}" onclick="toggleAvailDay(${i})">${d}</button>`).join('')}</div></div>` : ''}
    <div class="field"><label>When</label>
      <div class="seg"><button class="${f.allDay?'on':''}" onclick="S.availForm.allDay=true;render()">All day</button><button class="${!f.allDay?'on':''}" onclick="S.availForm.allDay=false;render()">Between</button></div></div>
    ${!f.allDay ? `<div class="row" style="gap:10px">
      <div class="field" style="flex:1"><label>From</label><select onchange="S.availForm.start=this.value">${slots.map(x=>`<option ${f.start===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="field" style="flex:1"><label>To</label><select onchange="S.availForm.end=this.value">${slots.map(x=>`<option ${f.end===x?'selected':''}>${x}</option>`).join('')}</select></div>
    </div>` : ''}
    <div class="field"><label>Note (optional)</label><input value="${esc(f.note)}" placeholder="e.g. Robotics practice" oninput="S.availForm.note=this.value"></div>
    <button class="btn" onclick="addAvail('${sel}')">Save</button>`;
}
function toggleAvailDay(i){ const a=S.availForm.weekdays, k=a.indexOf(i); if(k<0) a.push(i); else a.splice(k,1); render(); }
function addAvail(sel){
  const f=S.availForm, me=A.user.id;
  const start = f.allDay ? 0 : slotMin(f.start), end = f.allDay ? 1440 : slotMin(f.end);
  if(!f.allDay && (start===null || end===null || end<=start)){ toast('The end time needs to be after the start.'); return; }
  if(f.recurring && !f.weekdays.length){ toast('Pick at least one day of the week.'); return; }
  const rows = f.recurring
    ? f.weekdays.map(wd=>({ user_id:me, kind:f.kind, recurring:true, weekday:wd, start_min:start, end_min:end, note:f.note.trim() }))
    : [{ user_id:me, kind:f.kind, recurring:false, date:sel, start_min:start, end_min:end, note:f.note.trim() }];
  sbFetch('/rest/v1/sl_availability', { method:'POST', headers:{ Prefer:'return=minimal' }, body:JSON.stringify(rows) })
    .then(loadData).then(function(){ S.availForm.note=''; if(S.cal) S.cal.tab='see'; toast('Saved'); render(); }).catch(function(e){ toast(e.message); });
}
function deleteAvail(id){
  S.availability = S.availability.filter(b=>b.id!==id); render();
  sbFetch('/rest/v1/sl_availability?id=eq.'+id, { method:'DELETE', headers:{ Prefer:'return=minimal' } }).catch(function(e){ toast(e.message); loadData().then(render); });
}
function calMove(n){
  let { y, m } = S.cal; m+=n;
  if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
  S.cal = { y, m, sel: ymd(new Date(y,m,1)) };
  render();
}
function addEvent(){
  const title=$('ev_title').value.trim();
  if(!title){ $('ev_title').focus(); return; }
  const t=$('ev_time').value;
  const time = t ? new Date('2000-01-01T'+t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}) : '';
  const ev={ id:uid(), user_id:A.user.id, date:S.cal.sel, time, title, kind:$('ev_kind').value, course:$('ev_course').value };
  S.events.push(ev);
  S.cal.tab='see'; render(); toast('Added to '+fmtDate(S.cal.sel));
  sbFetch('/rest/v1/sl_events', { method:'POST', body:JSON.stringify({ user_id:ev.user_id, date:ev.date, time, title, kind:ev.kind, course:ev.course }) })
    .then(function(rows){ if(rows && rows[0]) ev.id = rows[0].id; })
    .catch(function(e){ toast(e.message); loadData().then(render); });
}
function deleteEvent(id){
  S.events=S.events.filter(e=>e.id!==id);
  render();
  sbFetch('/rest/v1/sl_events?id=eq.'+id, { method:'DELETE', headers:{ Prefer:'return=minimal' } }).catch(function(e){ toast(e.message); loadData().then(render); });
}

}

// Tutee side: the tutors for this class, with the grade and format filters.
// The one Filter button every list uses: a count of what's active, a caret.
const filterBtn = (key, active) => `<button class="btn ghost sm" style="margin-left:auto;white-space:nowrap" onclick="S.${key}=!S.${key};render()">⚙ Filter${active?' · '+active:''} ${S[key]?'▴':'▾'}</button>`;
function tutorsHtml(course){
  let tutors = tutorsFor(course);
  const f = S.overlay.filter || {};
  if(f.grade) tutors = tutors.filter(t=>{ const g=(t.courses.find(x=>x.course===course)||{}).grade||''; return f.grade==='A'?g.startsWith('A'):f.grade==='B'?(g.startsWith('A')||g.startsWith('B')):true; });
  if(f.format) tutors = tutors.filter(t=>t.format.toLowerCase().includes(f.format));
  if(f.day && f.time) tutors = tutors.filter(t=>freeAt(t.id, f.day, f.time).free);
  const active = (f.grade?1:0) + (f.format?1:0) + (f.day&&f.time?1:0);
  const openF = !!S.overlay.showFilters;
  return `
    <div class="row" style="margin-top:12px">
      <div class="sectlabel" style="margin:0">${tutors.length} peer tutor${tutors.length===1?'':'s'}</div>

    </div>
    ${openF ? `<div class="card" style="margin-top:8px;padding:10px 12px">
      <div class="tiny" style="margin-bottom:6px">Grade earned</div>
      <div class="chips">${[['','Any'],['B','B or higher'],['A','A only']].map(([v,l])=>`<button class="chip ${(!f.grade&&!v)||f.grade===v?'dept':''}" style="${(!f.grade&&!v)||f.grade===v?'background:'+courseColor(course):''}" onclick="setFilter('grade','${v}')">${l}</button>`).join('')}</div>
      <div class="tiny" style="margin:10px 0 6px">Format</div>
      <div class="chips">${[['','Any'],['virtual','Virtual'],['person','In person']].map(([v,l])=>`<button class="chip ${(!f.format&&!v)||f.format===v?'dept':''}" style="${(!f.format&&!v)||f.format===v?'background:'+courseColor(course):''}" onclick="setFilter('format','${v}')">${l}</button>`).join('')}</div>
      <div class="tiny" style="margin:10px 0 6px">Free at a certain time</div>
      <div class="row" style="gap:8px;flex-wrap:wrap">
        <input type="date" value="${esc(f.day||'')}" min="${ymd(new Date())}" onchange="setFilter('day',this.value)" style="padding:8px 10px;border:1.5px solid #e5e2f0;border-radius:10px;font:inherit;font-size:13px">
        <select onchange="setFilter('time',this.value)" style="padding:8px 10px;border:1.5px solid #e5e2f0;border-radius:10px;font:inherit;font-size:13px;background:#fff"><option value="">Any time</option>${TIME_SLOTS.map(x=>`<option ${f.time===x?'selected':''}>${x}</option>`).join('')}</select>
      </div>
      ${active ? `<button class="btn ghost sm" style="margin-top:10px" onclick="S.overlay.filter={};render()">Clear filters</button>` : ''}
    </div>` : ''}
    <div style="height:8px"></div>
    ${tutors.length ? tutors.map(t=>tutorCard(t,course)).join('') : `<div class="empty"><div class="em">🔍</div>${tutorsFor(course).length ? 'No tutors match — try loosening the filters.' : 'No tutors for this class yet. Ask on the Community tab, or check back soon.'}</div>`}`;
}

// Tutor side: the students taking this class, and a way to offer them help.
function tuteesHtml(course){
  const me=A.user.id, canOffer = !isAdmin() && S.me.isTutor && S.tutorClasses.includes(course);
  const students = S.roster.filter(r=>r.course===course).sort((a,b)=>a.student_alias.localeCompare(b.student_alias, undefined, {numeric:true}));
  const stateFor = sid => S.incoming.find(r=>r.student_id===sid && r.course===course && ['offered','pending','accepted'].includes(r.status));
  return `
    ${canOffer || isAdmin() ? '' : `<div class="card tiny" style="margin-top:10px">To offer help here, add ${esc(course)} to the classes you tutor first.${S.me.isTutor ? '' : ' <button class="btn ghost sm" style="margin-left:6px" onclick="openView({type:\'becomeTutor\'})">Become a tutor</button>'}</div>`}
    <div class="sectlabel">${students.length} student${students.length===1?'':'s'} taking ${esc(course)}</div>
    ${students.length ? students.map(st=>{ const r=stateFor(st.user_id); return `<div class="card row">
      ${avatarDot(initials(st.student_alias), st.last_seen_at, 'background:'+courseColor(course))}
      <div style="min-width:0;flex:1"><div style="font-weight:800">${esc(st.student_alias)} ${seenHtml(st.last_seen_at)}</div><div class="tiny">${st.grade_level?'Grade '+st.grade_level:''}${r ? (st.grade_level?' · ':'') + (r.status==='offered' ? 'You offered to help' : r.status==='pending' ? 'They asked you for help' : 'Session booked') : ''}</div></div>
      ${r ? `<span class="pill" style="margin-left:auto;${r.status==='accepted'?'background:#e4f6ec;color:#2e9b6a':''}">${r.status==='offered'?'Offered':r.status==='pending'?'Requested':'Confirmed'}</span>`
          : canOffer ? `<span class="row" style="gap:6px;margin-left:auto;flex:0 0 auto"><button class="btn sm ghost" onclick="openView({type:'schedule', course:'${esc(course)}', student:'${st.user_id}'})">📅 Schedule</button><button class="btn sm" onclick="offerHelp('${st.user_id}','${esc(st.student_alias)}','${esc(course)}',this)">Offer help</button></span>` : ''}
    </div>`; }).join('') : `<div class="empty"><div class="em">🎓</div>Nobody has added ${esc(course)} as a class yet.</div>`}`;
}
// A tutor's offer is a request that starts on the tutor's side; the student
// accepts or declines it from Tutoring, like any request.
function offerHelp(studentId, alias, course, btn){
  if(btn){ btn.disabled=true; btn.textContent='Offering…'; }
  sbFetch('/rest/v1/sl_requests', { method:'POST', headers:{ Prefer:'return=minimal' }, body:JSON.stringify({
      student_id:studentId, tutor_id:A.user.id, student_alias:alias, tutor_alias:A.profile.tutor_alias, course, topic:'Offer to help', note:'', time:'TBD', format:A.profile.tutor_format||'In person', status:'offered' }) })
    .then(loadData).then(function(){ toast('Offered to help '+alias); render(); })
    .catch(function(e){ toast(e.message); render(); });
}

          ${m.note ? `<div style="font-size:13px;margin-top:2px;line-height:1.4">${esc(m.note)}</div>` : ''}

function addMaterial(course){
  const title=($('mt_title').value||'').trim(), url=($('mt_url').value||'').trim(), note=($('mt_note').value||'').trim();
  if(!title){ $('mt_title').focus(); return; }
  if(url && !/^https?:\/\//i.test(url)){ toast('Links need to start with http:// or https://'); $('mt_url').focus(); return; }
  sbFetch('/rest/v1/sl_materials', { method:'POST', headers:{ Prefer:'return=minimal' }, body:JSON.stringify({ course, title, url, note, author_id:A.user.id, author_alias:currentAlias() }) })
    .then(loadData).then(function(){ toast('Added to '+course); render(); }).catch(function(e){ toast(e.message); });
}
function deleteMaterial(id){
  S.materials = S.materials.filter(m=>m.id!==id); render();
  sbFetch('/rest/v1/sl_materials?id=eq.'+id, { method:'DELETE', headers:{ Prefer:'return=minimal' } }).catch(function(e){ toast(e.message); loadData().then(render); });
}

// The class board, embedded in the Community section of the class page.
// ---- Study groups ----
// Every class has one main group: everyone taking it plus its tutors. Anyone
// can start another, picking a tutor to supervise it; the group opens once
// that tutor accepts. The tutor and the person who started it are in it from
// the start, anyone in the class can join.
const groupsFor = course => (S.groups||[]).filter(g=>g.course===course && g.status!=='closed');
const groupMembers = gid => (S.groupMembers||[]).filter(m=>m.group_id===gid && (m.status||'member')==='member');
const groupAsks = gid => (S.groupMembers||[]).filter(m=>m.group_id===gid && m.status==='requested');
const inGroup = (g, uid) => g.tutor_id===uid || g.created_by===uid || groupMembers(g.id).some(m=>m.user_id===uid);
const askedToJoin = (g, uid) => groupAsks(g.id).some(m=>m.user_id===uid);
const canApprove = (g, uid) => g.tutor_id===uid || g.created_by===uid || isStaff();
function mainGroupCount(course){
  const me=A.user.id;
  const students=new Set(S.roster.filter(r=>r.course===course).map(r=>r.user_id)); if(S.myClasses.includes(course)) students.add(me);
  const tutors=new Set(tutorsFor(course).map(t=>t.id)); if(S.tutorClasses.includes(course)) tutors.add(me);
  return { students:students.size, tutors:tutors.size };
}
// You can supervise a group yourself if you've taken the class (or already tutor it).
const canSelfSupervise = course => S.tutorClasses.includes(course) || (S.taken||[]).some(g=>g.course===course);
function groupsHtml(course){
  const me=A.user.id, list=groupsFor(course);
  const todayK=ymd(new Date());
  const latest = gid => (S.posts||[]).filter(p=>p.group_id===gid && ymd(new Date(p.created_at))===todayK).sort((a,b)=>b.created_at.localeCompare(a.created_at))[0];
  const row = g => { const m=groupMembers(g.id), n=m.length+(m.some(x=>x.user_id===g.tutor_id)?0:1), last=latest(g.id), mine=inGroup(g,me);
    return `<div class="card row" style="cursor:pointer" onclick="openView({type:'groupChat', id:'${g.id}'})">
      <div class="avatar" style="background:${courseColor(course)}">${g.status==='pending'?'⏳':'📚'}</div>
      <div style="min-width:0;flex:1"><div style="font-weight:800">${esc(g.name)} ${mine?'<span class="tiny">· you\'re in</span>':''}</div>
        <div class="tiny" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${g.status==='pending' ? 'Waiting for '+esc(g.tutor_alias||'the tutor')+' to accept' : 'Supervised by '+esc(g.tutor_alias||'a tutor')+' · '+n+' in it'+(last ? ' · '+esc(last.author_alias||'')+': '+esc(last.body||'') : ' · no messages yet')}</div></div>
      ${g.status==='pending' && g.tutor_id===me ? '<span class="pill" style="background:#fbf1e2;color:#c98b34">Your call</span>' : canApprove(g,me) && groupAsks(g.id).length ? `<span class="pill" style="background:#fbf1e2;color:#c98b34">${groupAsks(g.id).length} asking to join</span>` : askedToJoin(g,me) ? '<span class="pill">Asked to join</span>' : ''}
      <div style="color:var(--muted)">›</div></div>`; };
  const form = S.groupForm ? `<div class="card" style="margin-top:10px;border-color:var(--blue)">
      <div style="font-weight:800;margin-bottom:8px">Start a study group</div>
      <div class="field"><label>Name</label><input id="gp_name" placeholder="e.g. Tuesday unit circle crew" maxlength="60"></div>
      <div class="field" style="margin-bottom:0"><label>Which tutor will supervise it?</label>
        <select id="gp_tutor" onchange="S.groupSelf=this.value==='me';render()">${(canSelfSupervise(course) ? `<option value="me" ${S.groupSelf?'selected':''}>Me — I'll supervise it</option>` : '')}${tutorsFor(course).filter(t=>t.id!==me).map(t=>`<option value="${t.id}" ${!S.groupSelf&&false?'':''}>${esc(t.name)}</option>`).join('') || (S.tutorClasses.includes(course) ? '' : '<option value="">No tutors for this class yet</option>')}</select>
        <div class="tiny" style="margin-top:6px">${S.groupSelf || (canSelfSupervise(course) && !tutorsFor(course).some(t=>t.id!==me)) ? 'You\'ve taken this class, so you can supervise it and it opens right away.' : 'The group opens once the tutor accepts. They\'re in it from the start.'}</div></div>
      <div class="row" style="gap:8px;margin-top:12px"><button class="btn gray" style="flex:1" onclick="S.groupForm=false;render()">Cancel</button><button class="btn" style="flex:2" ${tutorsFor(course).some(t=>t.id!==me) || (canSelfSupervise(course)) ? '' : 'disabled'} onclick="createGroup('${esc(course)}',this)">${S.groupSelf ? 'Start the group' : 'Ask the tutor'}</button></div>
    </div>` : '';
  const mc=mainGroupCount(course), mainLast=(S.posts||[]).filter(p=>p.course===course && !p.group_id && !p.parent_id && ymd(new Date(p.created_at))===todayK).sort((a,b)=>b.created_at.localeCompare(a.created_at))[0];
  const mainRow = `<div class="card row" style="cursor:pointer" onclick="openView({type:'groupChat', id:'main:${esc(course)}'})">
      <div class="avatar" style="background:${courseColor(course)}">👥</div>
      <div style="min-width:0;flex:1"><div style="font-weight:800">Everyone in ${esc(course)}</div>
        <div class="tiny" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${mc.students} student${mc.students===1?'':'s'} · ${mc.tutors} tutor${mc.tutors===1?'':'s'}${mainLast ? ' · '+esc(mainLast.author_alias||'')+': '+esc(mainLast.body||'') : ' · no messages yet'}</div></div>
      <div style="color:var(--muted)">›</div></div>`;
  return `${mainRow}${list.map(row).join('')}
    ${S.groupsReady ? `<button class="card addcard" style="width:100%;min-height:56px;margin-top:10px" onclick="S.groupForm=!S.groupForm;S.groupSelf=canSelfSupervise('${esc(course)}');render()">＋ Start a study group</button>` : ''}${form}`;
}
// A study group's chat: its own screen, bubbles like the session chat.
// ---- Quiet hours: no messaging during the school day ----
// 8:00 AM to 3:30 PM on school days (Mon–Fri), every chat is read-only. An
// administrator can change the window under Session times.
const DEFAULT_QUIET = { start:480, end:930, days:[1,2,3,4,5] };
function quietHours(){ const q=S.settings && S.settings.quiet; return q && typeof q.start==='number' ? q : DEFAULT_QUIET; }
function inQuietHours(now=new Date()){
  const q=quietHours(); if(!q.days.includes(now.getDay())) return false;
  const m=now.getHours()*60+now.getMinutes(); return m>=q.start && m<q.end;
}
const quietNote = () => `<div class="card tiny" style="text-align:center;border-color:#f3d9a0;background:#fff8e8">🔕 Messaging is off during the school day (${minLabel(quietHours().start)}–${minLabel(quietHours().end)}). You can read; sending opens again at ${minLabel(quietHours().end)}.</div>`;
let groupTimer=null;
function renderGroupChat(c){
  const id=S.overlay.id, isMain=String(id).startsWith('main:');
  const g = isMain ? { id, course:id.slice(5), name:'Everyone in '+id.slice(5), status:'active', main:true } : (S.groups||[]).find(x=>x.id===id);
  if(!g){ closeView(); return; }
  const me=A.user.id, members=isMain ? [] : groupMembers(g.id), mine=isMain ? true : inGroup(g,me);
  const canPost = g.status==='active' && (mine || isStaff()), canRead = mine || isStaff();
  const today=ymd(new Date());
  const msgs = canRead ? (S.posts||[]).filter(p=>p.course===g.course && (isMain ? !p.group_id : p.group_id===g.id) && ymd(new Date(p.created_at))===today).sort((a,b)=>a.created_at.localeCompare(b.created_at)) : [];
  const mc = isMain ? mainGroupCount(g.course) : null;
  c.innerHTML=`
    <button class="back" onclick="S.tab='classes'; openView({type:'board', course:'${esc(g.course)}'})">‹ ${esc(g.course)}</button>
    <div class="row" style="margin-bottom:10px;align-items:flex-start">
      <div class="avatar" style="background:${courseColor(g.course)};width:44px;height:44px;font-size:18px">${isMain?'👥':g.status==='pending'?'⏳':'📚'}</div>
      <div style="flex:1;min-width:0"><h2 class="title" style="margin:0">${esc(g.name)}</h2>
        <div class="tiny">${isMain ? mc.students+' student'+(mc.students===1?'':'s')+' · '+mc.tutors+' tutor'+(mc.tutors===1?'':'s')+' · everyone taking the class and its tutors' : (g.status==='pending' ? 'Waiting for '+esc(g.tutor_alias||'the tutor')+' to accept' : 'Supervised by '+esc(g.tutor_alias||'a tutor'))+' · '+(members.map(m=>esc(m.alias||'?')).join(', ')||'nobody yet')}</div></div>
      ${isMain ? '' : g.status==='pending' && g.tutor_id===me ? `<button class="btn sm green" onclick="superviseGroup('${g.id}',true)">Supervise</button><button class="btn sm gray" style="margin-left:6px" onclick="superviseGroup('${g.id}',false)">No</button>`
        : mine ? (g.tutor_id===me||g.created_by===me ? `<button class="btn sm gray" onclick="closeGroup('${g.id}')">Close</button>` : `<button class="btn sm gray" onclick="leaveGroup('${g.id}')">Leave</button>`)
        : askedToJoin(g,me) ? `<span class="pill">Asked to join</span>`
        : g.status==='active' ? `<button class="btn sm" onclick="joinGroup('${g.id}')">Ask to join</button>` : ''}
    </div>
    ${!isMain && canApprove(g,me) && groupAsks(g.id).length ? `<div class="card" style="border-color:var(--pink);margin-bottom:10px"><div style="font-weight:800;margin-bottom:6px">Asking to join</div>
      ${groupAsks(g.id).map(m=>`<div class="row" style="margin-bottom:6px"><span style="flex:1">${esc(m.alias||'?')}</span><button class="btn sm green" onclick="answerJoin('${g.id}','${m.user_id}',true)">Approve</button><button class="btn sm gray" style="margin-left:6px" onclick="answerJoin('${g.id}','${m.user_id}',false)">Decline</button></div>`).join('')}</div>` : ''}
    <div class="chatwrap"><div class="card chatcard"><div class="chat" id="gchat">${canRead ? (msgs.length ? msgs.map(m=>{ const own=m.author_id===me;
        const when=new Date(m.created_at).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
        return `<div class="msg ${own?'me':''}">${own?'':'<b class="tiny">'+esc(m.author_alias||'')+'</b><br>'}${esc(m.body)}<div class="t">${when}${own?'':` · <span class="rep" onclick="reportMessage('post','${m.id}')">report</span>`}${isStaff()?` · <span class="rep" onclick="deletePost('${m.id}')">remove</span>`:''}</div></div>`; }).join('')
        : '<div class="tiny" style="text-align:center;padding:12px">Nothing yet today. Say hi!</div>')
      : '<div class="tiny" style="text-align:center;padding:12px">'+(g.status==='pending' ? 'This group opens once '+esc(g.tutor_alias||'the tutor')+' accepts.' : askedToJoin(g,me) ? 'You\'ve asked to join. '+esc(g.tutor_alias||'The tutor')+' will approve it.' : 'Ask to join and the tutor will let you in.')+'</div>'}</div></div>
    ${canPost && inQuietHours() ? quietNote() : canPost ? `<div class="composer">
      <input id="gchat_in" maxlength="1000" placeholder="Message the group…" onkeydown="if(event.key==='Enter')sendGroupMsg('${g.id}','${esc(g.course)}')">
      <button class="btn sm" onclick="sendGroupMsg('${g.id}','${esc(g.course)}')">Send</button>
    </div>
    <p class="tiny" style="margin:8px 2px">🛡️ Posting as ${esc(currentAlias())}. ${isMain ? 'Tutors of this class see this chat too.' : esc(g.tutor_alias||'A tutor')+' supervises this group.'} Messages clear each day. Keep it to schoolwork; no phone numbers or socials.</p>` : ''}</div>`;
  const box=$('gchat'); if(box) box.scrollTop=box.scrollHeight;
  clearInterval(groupTimer);
  groupTimer=setInterval(()=>{ if(S.overlay && S.overlay.type==='groupChat' && S.overlay.id===g.id && !document.hidden) refreshGroup(g.id); else clearInterval(groupTimer); }, 5000);
}
async function refreshGroup(gid){
  const isMain=String(gid).startsWith('main:'), course=isMain?gid.slice(5):null;
  const match = p => isMain ? (p.course===course && !p.group_id) : p.group_id===gid;
  try{ const rows=await sbFetch(isMain ? '/rest/v1/sl_posts?select=*&course=eq.'+encodeURIComponent(course)+'&group_id=is.null&order=created_at' : '/rest/v1/sl_posts?select=*&group_id=eq.'+gid+'&order=created_at');
