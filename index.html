// ---- Availability ----
// Minutes since midnight for a slot label like "3:30 PM".
// "3:30 PM", or a range like "7:30–8:00 AM" / "3:30–4:30 PM": the start, in minutes.
function slotMin(label){
  const t=(label||'').replace(/[\u202f\u00a0]/g,' ').trim();
  const m=/^(\d+):(\d\d)(?: (AM|PM))?(?:\s*[–-]\s*(\d+):(\d\d) (AM|PM))?$/.exec(t); if(!m) return null;
  let h=+m[1]%12;
  const ap = m[3] || (m[6]==='AM' ? 'AM' : (+m[1]>=7 && +m[1]<=11 && +m[1] > +m[4]) ? 'AM' : m[6]);
  if(ap==='PM') h+=12;
  return h*60 + +m[2];
}
function minLabel(min){ if(min>=1440) return '12:00 AM'; const h=Math.floor(min/60), mm=min%60, h12=((h+11)%12)+1; return h12+':'+(mm<10?'0':'')+mm+' '+(h<12?'AM':'PM'); }
// When tutoring happens, and where. Before school and 8th period are inside
// the school; the hour-long after-school slots are off campus, so nothing
// over 45 minutes is ever in the building. A student may tick several times
// and places (or none) and the tutor picks when they accept.
const SLOT_GROUPS = ['Before school','8th period','After school'];
const IN_SCHOOL_GROUPS = ['Before school','8th period'];
const slotLabel = (a,b) => minLabel(a).replace(/ (AM|PM)$/,'')+'–'+minLabel(b);
const mkSlot = (group,a,b) => ({ group, label:slotLabel(a,b), start:a, end:b, school:IN_SCHOOL_GROUPS.includes(group) });
const DEFAULT_SESSIONS = {
  slots: [['Before school',450,480],['8th period',885,930], ...[[930,990],[960,1020],[990,1050],[1020,1080],[1050,1110],[1080,1140],[1110,1170],[1140,1200]].map(([a,b])=>['After school',a,b])],
  schoolPlaces: ['Library','Cafeteria','Commons','Other'],
  offCampusPlaces: ['Bettendorf Public Library','Vibrant Coffeehouse and Kitchen','Other'],
};
// Editable by an administrator (Session times); defaults until sl_settings has a row.
let SESSION_SLOTS = [], SCHOOL_PLACES = [], OFF_CAMPUS_PLACES = [];
function applySessionSettings(v){
  const c = v && Array.isArray(v.slots) && v.slots.length ? v : DEFAULT_SESSIONS;
  SESSION_SLOTS = c.slots.map(([g,a,b])=>mkSlot(g,+a,+b)).sort((x,y)=>SLOT_GROUPS.indexOf(x.group)-SLOT_GROUPS.indexOf(y.group) || x.start-y.start);
  SCHOOL_PLACES = (c.schoolPlaces||DEFAULT_SESSIONS.schoolPlaces).slice(); if(!SCHOOL_PLACES.includes('Other')) SCHOOL_PLACES.push('Other');
  OFF_CAMPUS_PLACES = (c.offCampusPlaces||DEFAULT_SESSIONS.offCampusPlaces).slice(); if(!OFF_CAMPUS_PLACES.includes('Other')) OFF_CAMPUS_PLACES.push('Other');
}
applySessionSettings(null);
const slotByLabel = l => SESSION_SLOTS.find(x=>x.label===l);
const VIBRANT = 'Vibrant Coffeehouse and Kitchen', VIBRANT_CLOSE = 18*60, VIBRANT_BOOK_URL = 'https://cal.com/vibrant-qc';
const MAX_SCHOOL_MINUTES = 45;
const OPTION_SEP = ' / ';
const splitOptions = v => (v||'').split(OPTION_SEP).map(x=>x.trim()).filter(Boolean);
function placesFor(slots){
  const out=[];
  if(slots.some(x=>x.school)) SCHOOL_PLACES.forEach(p=>{ if(!out.includes(p)) out.push(p); });
  if(slots.some(x=>!x.school)) OFF_CAMPUS_PLACES.forEach(p=>{ if(p===VIBRANT && !slots.some(x=>!x.school && x.end<=VIBRANT_CLOSE)) return; if(!out.includes(p)) out.push(p); });
  return out;
}
const placeFits = (place, slot) => slot ? (slot.school ? SCHOOL_PLACES.includes(place.split(' · ')[0]) : (OFF_CAMPUS_PLACES.includes(place.split(' · ')[0]) && !(place.startsWith(VIBRANT) && slot.end>VIBRANT_CLOSE))) : true;
const vibrantNote = () => `<div class="card tiny" style="margin-top:8px;border-color:var(--pink)">☕ Vibrant needs to be booked ahead. <a href="${VIBRANT_BOOK_URL}" target="_blank" rel="noopener" style="font-weight:800">Reserve a table →</a> It closes at 6 PM.</div>`;
const pick = { times:new Set(), places:new Set() };
function pickerHtml(){
  const chosen=[...pick.times].map(slotByLabel).filter(Boolean);
  const places=placesFor(chosen);
  [...pick.places].forEach(pl=>{ if(!places.includes(pl)) pick.places.delete(pl); });
  const chip=(on,label,fn,extra='')=>`<button class="chip ${on?'dept':''}" style="${on?'background:var(--blue)':''}" onclick="${fn}">${on?'✓ ':''}${esc(label)}${extra}</button>`;
  return `
    <div class="field" style="margin-top:12px"><label>When works for you? <span class="tiny" style="text-transform:none;letter-spacing:0;font-weight:600">Tick any that work, or none and the tutor picks.</span></label>
      ${SLOT_GROUPS.map(g=>`<div class="tiny" style="margin:6px 0 4px;font-weight:800">${g}${g==='After school'?' <span style="font-weight:600">· one hour, off campus</span>':''}</div>
        <div class="chips">${SESSION_SLOTS.filter(x=>x.group===g).map(x=>{ const r=pickerFree(x.label); return chip(pick.times.has(x.label), x.label, `pickToggle('times','${x.label}')`, r===null?'':r?'':' <span style="color:#c23b5e">busy</span>'); }).join('')}</div>`).join('')}
    </div>
    <div class="field" style="margin-bottom:0"><label>Where? <span class="tiny" style="text-transform:none;letter-spacing:0;font-weight:600">${chosen.length ? 'Tick any.' : 'Pick a time first, or leave it to the tutor.'}</span></label>
      <div class="chips">${places.map(pl=>chip(pick.places.has(pl), pl, `pickToggle('places','${pl}')`)).join('')}</div>
      ${pick.places.has('Other') ? `<input id="rq_locd" placeholder="Where exactly?" value="${esc(pick.otherText||'')}" oninput="pick.otherText=this.value" style="margin-top:8px">` : ''}
      ${pick.places.has(VIBRANT) ? vibrantNote() : ''}
    </div>`;
}
let pickerTutor=null;
function pickerFree(label){ const day=$('rq_day')?.value; if(!day || !pickerTutor || reqMany()) return null; return bothFree(pickerTutor, day, label); }
function pickToggle(kind, v){ if(v!=='__none__'){ pick[kind].has(v) ? pick[kind].delete(v) : pick[kind].add(v); } const box=$('rq_pick'); if(box) box.innerHTML=pickerHtml(); checkFree(pickerTutor); }
function pickedTimes(){ return SESSION_SLOTS.filter(x=>pick.times.has(x.label)).map(x=>x.label); }
function pickedPlaces(){ return [...pick.places].map(pl=> pl==='Other' && (pick.otherText||'').trim() ? 'Other · '+pick.otherText.trim() : pl); }
const slotMinutes = label => { const x=slotByLabel(label); return x ? x.end-x.start : 45; };
// The tutor's schedule form: one slot, and the places that fit it.
function fillLocations(){
  const sel=$('rq_loc'); if(!sel) return;
  const slot=slotByLabel($('sc_time')?.value) || SESSION_SLOTS[2];
  const keep=sel.value;
  sel.innerHTML = placesFor([slot]).map(x=>`<option>${x}</option>`).join('');

const DAY_NAMES=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
// The blocks that apply to one date, for one person.
// Class periods are stored as weekly 'unavailable' blocks whose note starts
// with CLASS_NOTE. They block tutoring like any busy time, but they belong to
// the class schedule, not the calendar, so blocksOn leaves them out.
const CLASS_NOTE = 'Class · ';
const isClassBlock = b => b.kind==='unavailable' && (b.note||'').startsWith(CLASS_NOTE);
// One hidden row per person remembers the picks themselves (which class each
// period, study halls, which lunch) so the editor can show them again.
const PLAN_NOTE = CLASS_NOTE+'@plan ';
const isPlanBlock = b => (b.note||'').startsWith(PLAN_NOTE);
function blocksOn(userId, dateKey){
  const wd=parseYmd(dateKey).getDay();
  return (S.availability||[]).filter(b => b.user_id===userId && !isClassBlock(b) && (b.recurring ? b.weekday===wd : b.date===dateKey));
}
function classesOn(userId, dateKey){
  const wd=parseYmd(dateKey).getDay();
  return (S.availability||[]).filter(b => b.user_id===userId && isClassBlock(b) && !isPlanBlock(b) && b.recurring && b.weekday===wd);
}
// My class periods, one per period (they repeat Monday to Friday).
function mySchedule(){
  const seen={}, out=[];
  (S.availability||[]).filter(b=>A.user && b.user_id===A.user.id && isClassBlock(b) && !isPlanBlock(b)).forEach(b=>{
    const key=b.start_min+'-'+b.end_min; if(seen[key]) return; seen[key]=1;
    out.push({ name:b.note.slice(CLASS_NOTE.length), start:b.start_min, end:b.end_min });
  });
  return out.sort((a,b)=>a.start-b.start);
}
// Free at a date and time? Unavailable blocks win. If the person has set any
// available blocks for that day, the time must fall inside one; with none
// set, the day is open.
function freeAt(userId, dateKey, timeLabel){
  const min=slotMin(timeLabel); if(min===null || !dateKey) return { free:true };
  const blocks=blocksOn(userId, dateKey);
  const hit = b => min>=b.start_min && min<b.end_min;
  const cls=classesOn(userId, dateKey).find(hit);
  if(cls) return { free:false, inClass:true, why:'in class then ('+cls.note.slice(CLASS_NOTE.length)+', '+minLabel(cls.start_min)+'–'+minLabel(cls.end_min)+')' };
  const busy=blocks.find(b=>b.kind==='unavailable' && hit(b));
  if(busy) return { free:false, why: busy.start_min===0&&busy.end_min===1440 ? 'unavailable that day' : 'unavailable '+minLabel(busy.start_min)+'–'+minLabel(busy.end_min) };
  const windows=blocks.filter(b=>b.kind==='available');
  if(windows.length && !windows.some(hit)) return { free:false, why:'only free '+windows.map(b=>b.start_min===0&&b.end_min===1440?'all day':minLabel(b.start_min)+'–'+minLabel(b.end_min)).join(', ')+' that day' };
  return { free:true };
}
function availLabel(b){
  const when = b.recurring ? 'Every '+DAY_NAMES[b.weekday] : fmtDate(b.date);
  const span = b.start_min===0 && b.end_min===1440 ? 'All day' : minLabel(b.start_min)+' – '+minLabel(b.end_min);
  return when+' · '+span;
}

// Times are picked from half-hour slots across the school day and evening.
// The default leans on the tutor's availability: mornings if they said
// before school, evenings if they said evenings, otherwise after school.
const TIME_SLOTS=(function(){ const out=[]; for(let m=7*60; m<=20*60; m+=30){ const h=Math.floor(m/60), mm=m%60; const h12=((h+11)%12)+1; out.push(h12+':'+(mm?'30':'00')+' '+(h<12?'AM':'PM')); } return out; })();
function suggestTime(t){
  const a=(t && t.avail)||'';
  if(/After school/.test(a)) return '3:30 PM';
  if(/Before school/.test(a)) return '7:30 AM';
  if(/Evenings/.test(a)) return '6:00 PM';
  return '3:30 PM';
}
// Where to meet, depending on the format. Classroom and Other take a detail.
function locDetail(){
  const v=$('rq_loc')?.value||'', d=$('rq_locd'); if(!d) return;
  d.style.display = v==='Other' ? 'block' : 'none';
  const vb=$('rq_vib'); if(vb) vb.innerHTML = v===VIBRANT ? vibrantNote() : '';
}
async function submitRequest(tid){
  const t=findTutor(tid); if(!t) return;
  const course=$('rq_course').value;
  const topic=$('rq_topic').value.trim()||'General help';
  const note=($('rq_desc').value||'').trim();
  const date=$('rq_day').value||null;
  const many=reqMany();
  const all=pickedTimes();
  const times = many ? all.slice(0,1) : all.filter(x=>bothFree(tid, date, x));
  if(all.length && !times.length){ toast('One of you is busy at every time ticked.'); return; }
  const time = times.join(OPTION_SEP) || 'Tutor picks';
  const dates = many ? manyDates().filter(k=>bothFree(tid,k,times[0])) : [date];
  if(many && !dates.length){ toast('Pick days the tutor is free.'); return; }
  const location = pickedPlaces().join(OPTION_SEP);
  const fmt = 'In person';
  // One time: settled now. Several, or none: the tutor picks when accepting.
  const minutes = times.length ? Math.min(...times.map(slotMinutes)) : 45;
  const btn=$('rq_send'); if(btn){ btn.disabled=true; btn.textContent='Sending…'; }
  try{
    // Many sessions go up as one row per date in a single insert, so they
    // share a created_at — that is how the tutor's side groups them.
    await sbFetch('/rest/v1/sl_requests', { method:'POST', headers:{ Prefer:'return=minimal' }, body:JSON.stringify(dates.map(d=>({
      student_id:A.user.id, tutor_id:tid, student_alias:A.profile.student_alias, tutor_alias:t.name,
      course, topic: many ? SERIES_TOPIC : topic, note, date:d, time, minutes, format:fmt, location }))) });
    await loadData();
    closeView(); go('tutoring');
    toast(many ? 'Asked '+t.name+' for '+dates.length+' sessions 🎉' : 'Request sent to '+t.name+' 🎉');
  }catch(e){
    toast(e.message); if(btn){ btn.disabled=false; btn.textContent='Send request to '+t.name; }
  }
}

/* -------- CLASS SCHEDULE -------- */
// Nobody can book tutoring during your classes. Students pick a class (or
// Study hall) for each period and say which lunch they have; the times come
// from the school's bell schedule, which an administrator sets under Session
// times. Study hall and lunch stay open for tutoring.
const DEFAULT_BELL = {
  periods: [[1,480,530],[2,535,585],[3,590,640],[4,645,695],[5,730,780],[6,785,835],[7,840,890]],
  lunches: [['A lunch',660,690],['B lunch',695,725],['C lunch',730,760]],
};
const STUDY = 'Study hall';
// PE meets every other day after 9th grade: Day 1 or Day 2, with another
// class (often study hall) in that period on the other day.
const PE1 = 'PE · Day 1', PE2 = 'PE · Day 2';
const PE_DAILY = 'Physical Education';   // every day, any grade
const isPE = v => v===PE1 || v===PE2;
function myGradeLevel(){ return (S.setup && S.setup.grade) || S.me.grade || (A.profile && A.profile.grade_level) || null; }
const peSplits = () => Number(myGradeLevel())!==9;
function bell(){ const b=S.settings && S.settings.bell; return b && Array.isArray(b.periods) && b.periods.length ? b : DEFAULT_BELL; }
const hhmm = m => String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const toMin = v => { const [h,m]=(v||'').split(':').map(Number); return isNaN(h)||isNaN(m) ? null : h*60+m; };
function myPlan(){
  const b=(S.availability||[]).find(x=>A.user && x.user_id===A.user.id && isPlanBlock(x));
  if(!b) return null;
  try { return JSON.parse(b.note.slice(PLAN_NOTE.length)); } catch(e){ return null; }
}
// The draft is { periods:{ '1':'Algebra 2', '2':'Study hall', … }, lunch:'B lunch' }.
// Someone with an older, typed schedule gets each period matched by time, and
// the class kept when the name they typed is a real class.
function scheduleDraft(){
  const plan=myPlan();
  if(plan && plan.periods) return { periods:{ ...plan.periods }, lunch:plan.lunch||'' };
  const out={ periods:{}, lunch:'' }, old=mySchedule();
  bell().periods.forEach(([n,a,b])=>{
    const hit=old.find(o=>o.start<b && o.end>a);
    out.periods[n] = hit ? (ALL_COURSES.includes(hit.name) ? hit.name : '') : (old.length ? STUDY : '');
  });
  return out;
}
function classChoices(){
  const mine=(S.setup && S.setup.taking && S.setup.taking.length ? S.setup.taking : (S.myClasses||[])).filter(x=>ALL_COURSES.includes(x));
  return { mine, rest: DEPTS.map(d=>({ d, cs:d.courses.filter(x=>!mine.includes(x)) })).filter(x=>x.cs.length) };
}
function scheduleEditorHtml(d){
  const B=bell(), { mine, rest }=classChoices();
  // Only the classes you take. "Another class…" opens the whole list for that
  // one period, and a class you picked before stays listed.
  const full = n => !mine.length || (d.full && d.full[n]);
  const opts = (v, n) => `<option value="" ${!v?'selected':''}>Pick a class…</option>
      <option value="${STUDY}" ${v===STUDY?'selected':''}>📗 Study hall</option>
      <option value="${PE_DAILY}" ${v===PE_DAILY?'selected':''}>🏃 Physical Education</option>
      ${peSplits() ? `<option value="${PE1}" ${v===PE1?'selected':''}>🏃 PE · Day 1</option><option value="${PE2}" ${v===PE2?'selected':''}>🏃 PE · Day 2</option>` : ''}
      ${mine.length ? `<optgroup label="Your classes">${mine.map(x=>`<option ${v===x?'selected':''}>${esc(x)}</option>`).join('')}</optgroup>` : ''}
      ${n!==undefined && full(n) ? rest.map(({d,cs})=>`<optgroup label="${d.emoji} ${esc(d.name)}">${cs.map(x=>`<option ${v===x?'selected':''}>${esc(x)}</option>`).join('')}</optgroup>`).join('')
        : `${v && ALL_COURSES.includes(v) && !mine.includes(v) ? `<option selected>${esc(v)}</option>` : ''}<option value="__more">＋ Another class…</option>`}`;
  return `<div class="card">
    <div class="tiny" style="font-size:13px;margin-bottom:10px;line-height:1.5">Pick the class you have each period, or <b>Study hall</b>. Nobody can book tutoring during a class. Study hall and lunch stay open.${mine.length ? ' The list shows the classes you take; pick <b>Another class…</b> if one is missing.' : ''}</div>
    ${B.periods.map(([n,a,b])=>{ const v=d.periods[n]||'', o=d.periods[n+'b']||STUDY; return `<div class="periodrow ${v===STUDY?'study':''}">
      <span class="pn">Period ${n}</span><span class="pt">${minLabel(a)} – ${minLabel(b)}</span>
      <select aria-label="Period ${n}" onchange="if(this.value==='__more'){ S.schedDraft.full=S.schedDraft.full||{}; S.schedDraft.full['${n}']=true; render(); return; } S.schedDraft.periods['${n}']=this.value; if(!isPE(this.value)) delete S.schedDraft.periods['${n}b']; render()">${opts(v, n)}</select>
      ${isPE(v) ? `<div style="flex-basis:100%;display:flex;align-items:center;gap:6px;padding-left:78px"><span class="tiny" style="font-weight:800">${v===PE1?'Day 2':'Day 1'}:</span>
        <select aria-label="Period ${n} on the other day" onchange="if(this.value==='__more'){ S.schedDraft.full=S.schedDraft.full||{}; S.schedDraft.full['${n}b']=true; render(); return; } S.schedDraft.periods['${n}b']=this.value; render()">${opts(o, n+'b').replace(/<option value="PE[^>]*>[^<]*<\/option>/g,'').replace(/<option value="Physical Education"[^>]*>[^<]*<\/option>/,'').replace('<option value="" selected>Pick a class…</option>','').replace('<option value="">Pick a class…</option>','')}</select></div>` : ''}
    </div>`; }).join('')}
    ${peSplits() ? '<div class="tiny" style="margin-top:6px">Have PE every other day? Pick <b>PE · Day 1</b> or <b>PE · Day 2</b>, then what you have that period on the other day.</div>' : ''}
    <div style="margin-top:14px"><div style="font-weight:800;font-size:14px;margin-bottom:6px">Which lunch do you have?</div>
      <div class="chips">${B.lunches.map(([name,a,b])=>`<button class="chip ${d.lunch===name?'dept':''}" style="${d.lunch===name?'background:var(--blue)':''}" onclick="S.schedDraft.lunch='${esc(name)}'; render()">${esc(name)} <span style="opacity:.75;font-weight:600">· ${minLabel(a)}–${minLabel(b)}</span></button>`).join('')}</div></div>
  </div>`;
}
function scheduleProblem(d){
  const miss=bell().periods.find(([n])=>!d.periods[n]);
  if(miss) return 'Pick a class or Study hall for Period '+miss[0]+'.';
  if(!d.lunch) return 'Pick which lunch you have.';
  return '';
}
// Class periods minus the lunch window, so lunch stays bookable even when it
// falls inside a period.
function classSpans(d){
  const B=bell(), L=B.lunches.find(x=>x[0]===d.lunch), out=[];
  B.periods.forEach(([n,a,b])=>{
    const c=d.periods[n]; if(!c || c===STUDY) return;
    // PE alternates days and the app doesn't know which date is Day 1, so a PE
    // period stays blocked on both days.
    const parts = L && L[1]<b && L[2]>a ? [[a,L[1]],[L[2],b]] : [[a,b]];
    const nm = isPE(c) ? c+' / '+(c===PE1?'Day 2: ':'Day 1: ')+(d.periods[n+'b']||STUDY) : c;
    parts.filter(([x,y])=>y>x).forEach(([x,y])=>out.push({ start:x, end:y, name:'Period '+n+' · '+nm }));
  });
  return out;
}
async function saveSchedule(d){
  const me=A.user.id;
  await sbFetch('/rest/v1/sl_availability?user_id=eq.'+me+'&kind=eq.unavailable&note=like.'+encodeURIComponent(CLASS_NOTE+'*'), { method:'DELETE', headers:{ Prefer:'return=minimal' } });
  const rows=[];
  classSpans(d).forEach(p=>{ for(let wd=1; wd<=5; wd++) rows.push({ user_id:me, kind:'unavailable', recurring:true, weekday:wd, start_min:p.start, end_min:p.end, note:CLASS_NOTE+p.name }); });
  // The picks themselves: Sunday 12:00–12:01 AM, never a tutoring time.
  rows.push({ user_id:me, kind:'unavailable', recurring:true, weekday:0, start_min:0, end_min:1, note:PLAN_NOTE+JSON.stringify({ periods:d.periods, lunch:d.lunch }) });
  await sbFetch('/rest/v1/sl_availability', { method:'POST', headers:{ Prefer:'return=minimal' }, body:JSON.stringify(rows) });
}

// Warn when the tutor already has something booked at that day and time.
function checkClash(){
  const day=$('sc_day')?.value, time=$('sc_time')?.value, box=$('sc_clash'); if(!box) return;
  const sid=$('sc_student')?.value, btn=$('sc_send');
  const me=freeAt(A.user.id, day, time), them=sid ? freeAt(sid, day, time) : { free:true };
  if(btn) btn.disabled = !sid || !me.free || !them.free;

async function sendRetime(){
  const r=findReq(S.overlay.id), o=otherSide(r), date=$('rt_day').value, time=$('rt_time').value, msg=$('rt_msg').value.trim();

let chatTimer=null;
function sendMessage(requestId, body){

async function sendChat(){

function requestGroups(rows){
  const groups=[], by={};
  rows.forEach(r=>{

    by[key].push(r);

  groups.forEach(g=>g.sort((a,b)=>(a.date||'').localeCompare(b.date||'')));
  return groups;

// Status changes go to the server, then everything reloads so both sides agree.
function patchRequest(id, patch, okMsg){
  return sbFetch('/rest/v1/sl_requests?id=eq.'+id, { method:'PATCH', headers:{ Prefer:'return=minimal' }, body:JSON.stringify(patch) })
    .then(loadData).then(function(){ render(); if(okMsg) toast(okMsg); })
    .catch(function(e){ toast(e.message); });
}
function cancelRequest(id){ patchRequest(id, { status:'cancelled' }, 'Request cancelled'); }
// Taking a tutoring date off the calendar. Either person in a session can
// cancel it; it asks once, right where the ✕ was, before anything changes.
const CANCEL_WORDS = { session:['Cancel session','Session cancelled'], request:['Cancel request','Request cancelled'], offer:['Withdraw offer','Offer withdrawn'] };
function cancelBtn(id, kind){
  if(S.confirmCancel===id) return `<span class="row" style="gap:6px;margin-left:auto;flex:0 0 auto" onclick="event.stopPropagation()">
      <button class="btn sm gray" onclick="S.confirmCancel=null; render()">Keep</button>
      <button class="btn sm pink" onclick="cancelTutoring('${id}','${kind}')">${CANCEL_WORDS[kind][0]}</button></span>`;
  return `<button class="del" title="${CANCEL_WORDS[kind][0]}" style="margin-left:auto;border:none;background:none;color:var(--muted);cursor:pointer;font-size:16px" onclick="event.stopPropagation(); S.confirmCancel='${id}'; render()">✕</button>`;
}
function cancelTutoring(id, kind){
  S.confirmCancel=null;
  patchRequest(id, { status:'cancelled' }, CANCEL_WORDS[kind][1]);
}
// Take a completed session off the books. The hours come off with it.
function removeDone(id){
  const r=S.incoming.find(x=>x.id===id); if(!r) return;
  if(!confirm('Remove this '+r.course+' session with '+r.student_alias+'? Its 0.75 service hours come off your total.')) return;
  sbFetch('/rest/v1/sl_requests?id=eq.'+id, { method:'DELETE', headers:{ Prefer:'return=minimal' } })
    .then(loadData).then(function(){ toast('Session removed'); render(); })
    .catch(function(e){ toast(e.message); });
}
function respondOffer(id, accept){
  const r=S.myRequests.find(x=>x.id===id); if(!r) return;
  patchRequest(id, { status: accept ? 'accepted' : 'declined' }, accept ? 'Session set with '+r.tutor_alias+' ✅' : 'Offer declined');
}
function respondRequest(id, accept){
  const r=S.incoming.find(x=>x.id===id); if(!r)return;
  if(accept && needsPick(r)){ openView({type:'pickSlot', id}); return; }
  patchRequest(id, { status: accept ? 'accepted' : 'declined' }, accept ? 'Session confirmed with '+r.student_alias+' ✅' : 'Request declined');
}
// A request with several times or places (or none) is settled by the tutor.
const needsPick = r => splitOptions(r.time).length!==1 || !slotByLabel(splitOptions(r.time)[0]) || splitOptions(r.location).length!==1;
function renderPickSlot(c){
  const r=findReq(S.overlay.id); if(!r){ closeView(); return; }
  const times = splitOptions(r.time).filter(slotByLabel); const anyTime = !times.length;
  const slots = anyTime ? SESSION_SLOTS : SESSION_SLOTS.filter(x=>times.includes(x.label));
  const st = S.overlay.pickSlot = S.overlay.pickSlot || { time: (slots.find(x=>bothFree(r.student_id, r.date, x.label))||slots[0]||{}).label, place:'' };
  const slot=slotByLabel(st.time);
  const offered = splitOptions(r.location);
  const places = (offered.length ? offered : placesFor([slot])).filter(pl=>placeFits(pl, slot));
  if(!places.includes(st.place)) st.place = places[0] || '';
  const batch=(S.overlay.ids||[]).map(findReq).filter(Boolean);
  c.innerHTML=`
    <button class="back" onclick="closeView()">‹ Back</button>
    <h2 class="title">Pick a time and place</h2>
    <div class="lead">${esc(r.student_alias)} · ${esc(r.course)} · ${batch.length>1 ? batch.length+' sessions, '+esc(fmtDate(batch[0].date))+' → '+esc(fmtDate(batch[batch.length-1].date)) : esc(fmtDate(r.date))}${anyTime ? ' · they left the time to you' : ' · they ticked '+times.length+' time'+(times.length===1?'':'s')}${batch.length>1?' · your pick applies to all of them':''}</div>
    <div class="card">
      <div class="field"><label>Time</label><div class="chips">${slots.map(x=>{ const ok=bothFree(r.student_id, r.date, x.label);
        return `<button class="chip ${st.time===x.label?'dept':''}" style="${st.time===x.label?'background:var(--blue)':''}" onclick="S.overlay.pickSlot.time='${x.label}';render()">${x.group} · ${x.label}${ok?'':' <span style=\"color:#c23b5e\">busy</span>'}</button>`; }).join('')}</div></div>
      <div class="field" style="margin-bottom:0"><label>Where</label><div class="chips">${places.map(pl=>`<button class="chip ${st.place===pl?'dept':''}" style="${st.place===pl?'background:var(--blue)':''}" onclick="S.overlay.pickSlot.place='${esc(pl)}';render()">${esc(pl)}</button>`).join('') || '<span class="tiny">No place fits that time.</span>'}</div>
        ${st.place==='Other' ? `<input id="ps_other" placeholder="Where exactly?" style="margin-top:8px">` : ''}
        ${st.place.startsWith(VIBRANT) ? vibrantNote() : ''}</div>
    </div>
    <div style="margin-top:14px"><button class="btn" ${st.time && st.place ? '' : 'disabled'} onclick="confirmPick('${r.id}')">Confirm ${batch.length>1 ? 'all '+batch.length+' sessions' : 'session'}</button></div>`;
}
function confirmPick(id){
  const r=findReq(id), st=S.overlay.pickSlot; if(!r||!st) return;
  const other=($('ps_other')?.value||'').trim();
  const place = st.place==='Other' && other ? 'Other · '+other : st.place;
  const batch=(S.overlay.ids||[id]).map(findReq).filter(Boolean);
  const ok=batch.filter(x=>bothFree(x.student_id, x.date, st.time)), busy=batch.length-ok.length;
  if(!ok.length){ toast('One of you is busy then.'); return; }
  closeView();
  sbFetch('/rest/v1/sl_requests?id=in.('+ok.map(x=>x.id).join(',')+')', { method:'PATCH', headers:{ Prefer:'return=minimal' }, body:JSON.stringify({ status:'accepted', time:st.time, location:place, minutes:slotMinutes(st.time) }) })
    .then(loadData).then(()=>{ render(); toast(ok.length+' session'+(ok.length===1?'':'s')+' confirmed with '+r.student_alias+' ✅'+(busy?' · '+busy+' skipped (busy then)':'')); })
    .catch(e=>toast(e.message));
}
// ---- Ratings ----
// A tutee's done sessions that haven't been rated. Optional: dismissed ones
// are remembered on this device.
const RATED_SKIP='sc-rate-skip', RATE_OFF='sc-rate-off';
function skippedRatings(){ try { return JSON.parse(localStorage.getItem(RATED_SKIP)||'[]'); } catch { return []; } }
const ratingPromptsOff = () => { try { return localStorage.getItem(RATE_OFF)==='1'; } catch { return false; } };
function unratedSessions(){
  const me=A.user.id, rated=new Set((S.ratings||[]).map(r=>r.request_id)), skip=new Set(skippedRatings());
  return (S.myRequests||[]).filter(r=>r.status==='done' && !rated.has(r.id) && !skip.has(r.id)).sort((a,b)=>(b.done_at||'').localeCompare(a.done_at||''));
}
function ratePromptHtml(){
  const u=unratedSessions(); if(!u.length || isAdmin() || ratingPromptsOff()) return '';
  const r=u[0];
  return `<div class="card row" style="border-color:var(--pink);cursor:pointer" onclick="openView({type:'rate', id:'${r.id}'})">
    <div class="avatar" style="background:var(--pink-d)">⭐</div>
    <div style="flex:1;min-width:0"><div style="font-weight:800">How was ${esc(r.course)} with ${esc(r.tutor_alias||'your tutor')}?</div>
      <div class="tiny">${esc(fmtDate(r.date))} · a quick rating helps the program. Optional.</div></div>
    <button class="btn sm ghost" onclick="event.stopPropagation(); skipRating('${r.id}')">Skip</button>
  </div>`;
}
function skipRating(id){ const a=skippedRatings(); a.push(id); try { localStorage.setItem(RATED_SKIP, JSON.stringify(a.slice(-50))); localStorage.setItem(RATE_OFF,'1'); } catch {} render(); }
function renderRate(c){
  const r=findReq(S.overlay.id); if(!r){ closeView(); return; }
  const d=S.overlay.rate = S.overlay.rate || { stars:0, on_time:null, prepared:null, understood:0, again:null, comment:'' };
  const yn=(k)=>`<div class="seg">${[[true,'Yes'],[false,'No']].map(([v,l])=>`<button class="${d[k]===v?'on':''}" onclick="S.overlay.rate.${k}=${v};render()">${l}</button>`).join('')}</div>`;
  const stars=(k)=>`<div class="row" style="gap:4px">${[1,2,3,4,5].map(n=>`<button style="border:none;background:none;font-size:30px;cursor:pointer;padding:2px;filter:${d[k]>=n?'none':'grayscale(1) opacity(.35)'}" onclick="S.overlay.rate.${k}=${n};render()">⭐</button>`).join('')}</div>`;
  c.innerHTML=`
    <button class="back" onclick="closeView()">‹ Back</button>
    <h2 class="title">Rate the session</h2>
    <div class="lead">${esc(r.course)} with ${esc(r.tutor_alias||'your tutor')} · ${esc(fmtDate(r.date))}. Only the program's administrators see this — never the tutor.</div>
    <div class="card">
      <div class="field"><label>Overall</label>${stars('stars')}</div>
      <div class="field"><label>Did they show up on time?</label>${yn('on_time')}</div>
      <div class="field"><label>Were they prepared?</label>${yn('prepared')}</div>
      <div class="field"><label>Do you understand the material better now?</label>${stars('understood')}<div class="tiny">1 = not really · 5 = a lot</div></div>
      <div class="field"><label>Would you book them again?</label>${yn('again')}</div>
      <div class="field" style="margin-bottom:0"><label>Anything else? (optional)</label><textarea rows="2" maxlength="500" placeholder="What went well, what didn't…" oninput="S.overlay.rate.comment=this.value">${esc(d.comment)}</textarea></div>
    </div>
    <div class="row" style="gap:8px;margin-top:14px">
      <button class="btn gray" style="flex:1" onclick="skipRating('${r.id}');closeView()">Skip</button>
      <button class="btn" style="flex:2" ${d.stars?'':'disabled'} onclick="submitRating('${r.id}',this)">Send rating</button>
    </div>`;
}
async function submitRating(id, btn){
  const r=findReq(id), d=S.overlay.rate; if(!r||!d||!d.stars) return;
  btn.disabled=true; btn.textContent='Sending…';
  try{
    await sbFetch('/rest/v1/sl_ratings', { method:'POST', headers:{ Prefer:'return=minimal' }, body:JSON.stringify({ request_id:id, rater_id:A.user.id, tutor_id:r.tutor_id, course:r.course, stars:d.stars, on_time:d.on_time, prepared:d.prepared, understood:d.understood||null, again:d.again, comment:(d.comment||'').trim()||null }) });
    await loadData(); closeView(); toast('Thanks — that helps 🙏');
  }catch(e){ toast(/sl_ratings/.test(e.message) ? 'Ratings are not set up yet — run sql/sl_settings_and_groups.sql.' : e.message); btn.disabled=false; btn.textContent='Send rating'; }
}
function completeSession(id){

}

// Anyone can flag a message; staff see the flags on their Home and can remove the message.

// Four short steps the first time someone signs in: grade, classes now,
// classes taken (with the grade earned), and whether they want to tutor.
// Classes taken are the only ones a person may tutor.
const LETTERS=['A+','A','A-','B+','B','B-','C+','C','C-','D+','D','D-'];
function setupState(){
  if(S.setup) return S.setup;
  const taken={}; (S.taken||[]).forEach(g=>{ taken[g.course]={ grade:g.grade||'A', year:g.year||defaultTaken() }; });
  const parsed=parseAvail(S.me.avail||'');
  S.setup = { step: hasGrade() ? 1 : 2, grade: hasGrade() ? (S.me.grade||10) : null, taking:S.myClasses.slice(), taken,
    use: S.me.isTutor ? (S.myClasses.length ? 'both' : 'tutor') : 'help',
    tutorPick: S.tutorClasses.slice(), days:parsed.days, times:parsed.times,
    format:(A.profile&&A.profile.tutor_format)||'In person', bio:(A.profile&&A.profile.tutor_bio)||'' };
  return S.setup;
}

// Classes taken: one claim per class. Verified claims at the same grade stay;
// anything else pending is replaced; removed classes drop their pending claim.
async function syncTakenClaims(taken){
  const me=A.user.id, have=(S.taken||[]);
  const keep=new Set(have.filter(g=>g.status==='verified' && taken[g.course] && taken[g.course].grade===g.grade).map(g=>g.id));
  const drop=have.filter(g=>!keep.has(g.id) && (g.status!=='verified' || !taken[g.course])).map(g=>g.id);
  if(drop.length) await sbFetch('/rest/v1/sl_grades?id=in.('+drop.join(',')+')', { method:'DELETE', headers:{ Prefer:'return=minimal' } });
  const submit=Object.entries(taken).filter(([course])=>!have.some(g=>keep.has(g.id) && g.course===course)).map(([course,v])=>({ user_id:me, course, grade:v.grade, year:v.year }));
  if(submit.length) await sbFetch('/rest/v1/sl_grades', { method:'POST', headers:{ Prefer:'return=minimal' }, body:JSON.stringify(submit) });
}
function setupScheduleNext(){
  const bad=scheduleProblem(S.schedDraft); if(bad){ A.setupMsg=bad; return render(); }
  A.setupMsg=''; S.setup.sched={ periods:{ ...S.schedDraft.periods }, lunch:S.schedDraft.lunch }; S.setup.step=5; render();
}
function setupToggleTaking(course){ const a=S.setup.taking, i=a.indexOf(course); if(i<0) a.push(course); else a.splice(i,1); render(); }
function setupToggleTaken(course){ const t=S.setup.taken; if(t[course]){ delete t[course]; S.setup.tutorPick=S.setup.tutorPick.filter(x=>x!==course); } else t[course]={ grade:'A', year:defaultTaken() }; render(); }
function setupTogglePick(course){ const a=S.setup.tutorPick, i=a.indexOf(course); if(i<0) a.push(course); else a.splice(i,1); render(); }
function setupPick(k,v){ const a=S.setup[k], i=a.indexOf(v); if(i<0) a.push(v); else a.splice(i,1); render(); }

async function finishSetup(btn){
  const st=S.setup, me=A.user.id;
  const wantsTutor=(st.use==='tutor'||st.use==='both') && Object.keys(st.taken).length>0;
  const picks=st.tutorPick.filter(c=>st.taken[c]);
  const avail=availText(st);
  if(wantsTutor && !picks.length){ A.setupMsg='Pick at least one class to tutor, or choose Get help.'; return render(); }
  if(wantsTutor && !avail){ A.setupMsg='Pick at least one day and one time you can help.'; return render(); }
  A.setupMsg=''; if(btn){ btn.disabled=true; btn.textContent='Saving…'; }
  try{
    await sbFetch('/rest/v1/sl_profiles?id=eq.'+me, { method:'PATCH', headers:{ Prefer:'return=minimal' }, body:JSON.stringify({ ...(hasGrade() ? { grade_level:st.grade } : { grade_level:null }), onboarded_at:new Date().toISOString(), ...(wantsTutor ? { tutor_bio:st.bio, tutor_format:st.format } : {}) }) });
    // Classes now.
    await sbFetch('/rest/v1/sl_student_classes?user_id=eq.'+me, { method:'DELETE', headers:{ Prefer:'return=minimal' } });
    if(st.taking.length) await sbFetch('/rest/v1/sl_student_classes', { method:'POST', headers:{ Prefer:'return=minimal' }, body:JSON.stringify(st.taking.map(course=>({ user_id:me, course }))) });
    await syncTakenClaims(st.taken);
    if(hasSchedule() && st.sched) await saveSchedule(st.sched);
    S.schedDraft=null;
    // Tutoring.
    if(wantsTutor){
      await ensureTutorAlias();
      await sbFetch('/rest/v1/sl_tutor_courses?user_id=eq.'+me, { method:'DELETE', headers:{ Prefer:'return=minimal' } });
      await sbFetch('/rest/v1/sl_tutor_courses', { method:'POST', headers:{ Prefer:'return=minimal' }, body:JSON.stringify(picks.map(course=>({ user_id:me, course, grade:st.taken[course].grade, year:st.taken[course].year, availability:avail }))) });
    }
    // Re-read the profile so onboarded_at (and any new tutor alias) is current;
    // otherwise the stale copy sends people straight back into setup.
    A.profile.onboarded_at = new Date().toISOString();
    await loadProfile();
    await loadData();
    S.setup=null; S.setupForce=false;
    S.mode = st.use==='tutor' ? 'tutor' : 'tutee'; A.role=(S.mode==='tutor' && A.profile.tutor_alias) ? 'tutor' : 'student'; S.me.name=currentAlias();
    document.getElementById('app').classList.remove('auth');
    go('home'); toast(wantsTutor ? 'All set — you can tutor '+picks.length+' class'+(picks.length===1?'':'es') : 'All set!');
  }catch(e){
    A.setupMsg=e.message; render();
  }
}

// Letter grades and the grade a class was taken in, for the tutor steps.
const TAKEN_GRADES=['Grade 6','Grade 7','Grade 8','Grade 9','Grade 10','Grade 11','Grade 12'];
const defaultTaken = () => 'Grade ' + Math.max(6, Math.min(12, (S.me.grade||10) - 1));
// Availability is picked, not typed: days and times of day, stored as one
// readable line such as "Mon, Wed · After school, Evenings".
const AVAIL_DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const AVAIL_TIMES=['Before school','After school','Evenings'];
function togglePick(k, v){ const a=S.overlay.draft[k]; const i=a.indexOf(v); if(i<0) a.push(v); else a.splice(i,1); render(); }
function availText(d){
  const days=AVAIL_DAYS.filter(x=>d.days.includes(x)), times=AVAIL_TIMES.filter(x=>d.times.includes(x));
  if(!days.length || !times.length) return '';
  const dayStr = days.length===5 && !days.includes('Sat') && !days.includes('Sun') ? 'Weekdays' : days.length===7 ? 'Every day' : days.join(', ');
  return dayStr + ' · ' + times.join(', ');
}
function parseAvail(str){
  const days=AVAIL_DAYS.filter(x=>new RegExp('\\b'+x+'\\b').test(str)), times=AVAIL_TIMES.filter(x=>str.includes(x));
  if(/Weekdays/.test(str)) days.push('Mon','Tue','Wed','Thu','Fri');
  if(/Every day/.test(str)) days.push.apply(days, AVAIL_DAYS);
  return { days:Array.from(new Set(days)), times };
}

async function saveTaken(){

    // Tutoring stays limited to classes taken: drop tutor courses no longer on the list.
    const gone=S.tutorClasses.filter(c=>!taken[c]);

    S.editTaken=null; toast('Saved'); render();

async function finishTutor(){
  const d=S.overlay.draft, me=A.user.id;
  const avail=availText(d);
  if(!avail){ toast('Pick at least one day and one time you can help.'); return; }
  const bio=$('bio')?$('bio').value.trim():d.bio;
  const btn=$('ft_btn'); if(btn){ btn.disabled=true; btn.textContent='Saving…'; }
  try{
    await ensureTutorAlias();
    await sbFetch('/rest/v1/sl_profiles?id=eq.'+me, { method:'PATCH', headers:{ Prefer:'return=minimal' }, body:JSON.stringify({ tutor_bio:bio, tutor_format:d.format }) });
    await sbFetch('/rest/v1/sl_tutor_courses?user_id=eq.'+me, { method:'DELETE', headers:{ Prefer:'return=minimal' } });
    const rows=Object.entries(d.courses).map(([course,v])=>({ user_id:me, course, grade:v.grade, year:v.year, availability:avail }));
    if(rows.length) await sbFetch('/rest/v1/sl_tutor_courses', { method:'POST', headers:{ Prefer:'return=minimal' }, body:JSON.stringify(rows) });
    // Each grade goes to an administrator to check. A grade already verified
    // at the same mark is left alone; anything else is submitted afresh.
    const have = await sbFetch('/rest/v1/sl_grades?select=id,course,grade,status&user_id=eq.'+me);
    const keep = new Set((have||[]).filter(g=>g.status==='verified' && d.courses[g.course] && d.courses[g.course].grade===g.grade).map(g=>g.id));
    const stale = (have||[]).filter(g=>!keep.has(g.id) && g.status==='pending').map(g=>g.id);
    if(stale.length) await sbFetch('/rest/v1/sl_grades?id=in.('+stale.join(',')+')', { method:'DELETE', headers:{ Prefer:'return=minimal' } });
    const submit = rows.filter(r => !(have||[]).some(g => keep.has(g.id) && g.course===r.course)).map(r=>({ user_id:me, course:r.course, grade:r.grade, year:r.year }));
    if(submit.length) await sbFetch('/rest/v1/sl_grades', { method:'POST', headers:{ Prefer:'return=minimal' }, body:JSON.stringify(submit) });
    await loadProfile(); await loadData();
    S.mode='tutor'; A.role='tutor'; S.me.name=currentAlias();
    closeView(); go('tutoring');
    toast('You\'re now tutoring as '+A.profile.tutor_alias+' 🎓');
  }catch(e){
    toast(e.message); if(btn){ btn.disabled=false; btn.textContent='Finish — start tutoring'; }
  }
}

// Students taking each class versus tutors for it. The gap is the story.
function needHeatHtml(){
  const rows = ALL_COURSES.map(cs=>{
    const students=(S.roster||[]).filter(r=>r.course===cs).length + (S.myClasses.includes(cs)?1:0);
    const tutors=tutorsFor(cs).length + (S.tutorClasses.includes(cs)?1:0);
    const gap = students===0 ? 'none' : tutors===0 ? 'high' : students/tutors>4 ? 'high' : students/tutors>2 ? 'some' : 'ok';
    return { cs, students, tutors, gap };
  }).filter(r=>r.students||r.tutors).sort((a,b)=>({high:0,some:1,ok:2,none:3}[a.gap]-{high:0,some:1,ok:2,none:3}[b.gap]) || (b.students-a.students));
  if(!rows.length) return '<div class="tiny" style="text-align:center;padding:8px">No classes added yet.</div>';
  const tag = g => g==='high' ? '<span class="pill" style="background:#fdecef;color:#c23b5e">High need</span>' : g==='some' ? '<span class="pill" style="background:#fbf1e2;color:#c98b34">Thin</span>' : g==='ok' ? '<span class="pill" style="background:#e4f6ec;color:#2e9b6a">Covered</span>' : '<span class="pill">No students</span>';
  return `<div class="listrow" style="cursor:default;font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.5px"><span class="t">Class</span><span class="r" style="width:70px;text-align:right">Students</span><span class="r" style="width:60px;text-align:right">Tutors</span><span class="r" style="width:90px;text-align:right">Gap</span></div>` +
    rows.map(r=>`<div class="listrow" onclick="openClass('${esc(r.cs)}')"><span class="dot" style="background:${courseColor(r.cs)}"></span><span class="t">${esc(r.cs)}</span><span class="r" style="width:70px;text-align:right">${r.students}</span><span class="r" style="width:60px;text-align:right">${r.tutors}</span><span class="r" style="width:90px;text-align:right">${tag(r.gap)}</span></div>`).join('');
}

function verifyAll(userId){
  sbFetch('/rest/v1/sl_grades?user_id=eq.'+userId+'&status=eq.pending', { method:'PATCH', headers:{ Prefer:'return=minimal' }, body:JSON.stringify({ status:'verified', reviewed_by:A.user.id, reviewed_at:new Date().toISOString() }) })
    .then(loadData).then(function(){ toast('All verified ✓'); render(); })
    .catch(function(e){ toast(e.message); });
}
function reviewGrade(id, status){
  const note = ($('gn_'+id) && $('gn_'+id).value || '').trim();
  const patch = status==='pending' ? { status, reviewed_by:null, reviewed_at:null } : { status, note, reviewed_by:A.user.id, reviewed_at:new Date().toISOString() };
  sbFetch('/rest/v1/sl_grades?id=eq.'+id, { method:'PATCH', headers:{ Prefer:'return=minimal' }, body:JSON.stringify(patch) })
    .then(loadData).then(function(){ toast(status==='verified' ? 'Grade verified ✓' : status==='rejected' ? 'Grade rejected' : 'Back to waiting'); render(); })
    .catch(function(e){ toast(e.message); });
}

const timeToMin = v => { const m=/^(\d+):(\d+)/.exec(v||''); return m ? (+m[1])*60 + (+m[2]) : 0; };
async function saveSessionTimes(btn){
  const d=S.timesDraft; if(!d) return;
  const value = { slots: d.slots.map(sl=>[sl[0],+sl[1],+sl[2]]).sort((x,y)=>SLOT_GROUPS.indexOf(x[0])-SLOT_GROUPS.indexOf(y[0]) || x[1]-y[1]),
    schoolPlaces: d.schoolPlaces.split(',').map(x=>x.trim()).filter(Boolean), offCampusPlaces: d.offCampusPlaces.split(',').map(x=>x.trim()).filter(Boolean) };
  btn.disabled=true; btn.textContent='Saving…';
  try{
    const quiet={ start:+d.quiet.start, end:+d.quiet.end, days:d.quiet.days.slice().sort() };
    const bellV={ periods:d.bell.periods.map(x=>[+x[0],+x[1],+x[2]]), lunches:d.bell.lunches.map(x=>[String(x[0]).trim(),+x[1],+x[2]]) };
    await sbFetch('/rest/v1/sl_settings', { method:'POST', headers:{ Prefer:'return=minimal,resolution=merge-duplicates' }, body:JSON.stringify([{ key:'sessions', value, updated_at:new Date().toISOString(), updated_by:A.user.id },{ key:'quiet', value:quiet, updated_at:new Date().toISOString(), updated_by:A.user.id },{ key:'bell', value:bellV, updated_at:new Date().toISOString(), updated_by:A.user.id }]) });
    S.settings = S.settings||{}; S.settings.sessions=value; S.settings.quiet=quiet; S.settings.bell=bellV; applySessionSettings(value); S.timesDraft=null;
    toast('Session times saved'); render();
  }catch(e){ toast(/sl_settings/.test(e.message) ? 'The settings table is not set up yet — run sql/sl_settings_and_groups.sql.' : e.message); btn.disabled=false; btn.textContent='Save for everyone'; }
}

// Codes are made here and stored on the approval row; the join function
// checks them. Unambiguous letters and digits, four and four.
function makeCode(){
  const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', b=new Uint8Array(8); crypto.getRandomValues(b);
  const c=Array.from(b, x=>a[x%a.length]).join(''); return c.slice(0,4)+'-'+c.slice(4);
}
function copyCode(code, btn){
  if(!code) return;
  const done=function(){ toast('Code '+code+' copied'); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, done); else done();
}
function newCode(email){
  const code=makeCode();
  sbFetch('/rest/v1/sl_staff?email=eq.'+encodeURIComponent(email), { method:'PATCH', headers:{ Prefer:'return=minimal' }, body:JSON.stringify({ join_code:code, code_created_at:new Date().toISOString(), code_used_at:null }) })
    .then(function(){ toast('New code for '+email+': '+code); render(); }).catch(function(e){ toast(e.message); });
}
// Level, name and grade are edited on the approval row; a trigger carries the
// change through to the person's profile if they have signed up.

  sbFetch('/rest/v1/sl_staff?email=eq.'+encodeURIComponent(email), { method:'PATCH', headers:{ Prefer:'return=minimal' }, body:JSON.stringify({ role }) })
    .then(function(){ toast(email+' is now '+label); render(); })
    .catch(function(e){ toast(e.message); render(); });
}
function saveMember(email){
  const k = email.replace(/\W/g,'_');
  const real_name = (($('me_name_'+k)||{}).value||'').trim(), g = ($('me_grade_'+k)||{}).value||'';
  if(!real_name){ $('me_name').focus(); return; }
  sbFetch('/rest/v1/sl_staff?email=eq.'+encodeURIComponent(email), { method:'PATCH', headers:{ Prefer:'return=minimal' }, body:JSON.stringify({ real_name, grade_level: g ? Number(g) : null }) })
    .then(function(){ toast('Saved'); render(); })
    .catch(function(e){ toast(e.message); });
}
function removeMember(email){
  if(!confirm('Remove '+email+' from SilverCircle? Their account and everything in it will be deleted.')) return;
  sbFetch('/rest/v1/sl_staff?email=eq.'+encodeURIComponent(email), { method:'DELETE', headers:{ Prefer:'return=minimal' } })

// After the alias screen: straight in if a session is already saved.
function finishIssued(){
  A.authView = 'signin'; A.authMsg = ''; A.authOk = '';
  if(A.token){ loadProfile().then(render).catch(function(){ render(); }); } else render();
}
async function doSetPassword(){
  const a = ($('np_pass')||{}).value || '', b = ($('np_pass2')||{}).value || '';
  if(a.length < 6){ A.authMsg = 'Passwords must be at least 6 characters.'; return render(); }
  if(a !== b){ A.authMsg = 'Those two do not match.'; return render(); }
  A.authBusy = true; A.authMsg = ''; render();
  try {
    await sbFetch('/auth/v1/user', { method:'PUT', body: JSON.stringify({ password: a }) });
    A.authBusy = false;
    const alias = await ensureProfile();      // first arrival: issue the alias
    if(alias){ A.signedUpAlias = alias; A.authView = 'issued'; A.profile = null; }
    else { A.authView = 'signin'; }
    render();
  } catch(e){
    A.authBusy = false;
    A.authMsg = /approved/i.test(e.message) ? 'This email address has not been approved by the school.' : e.message;
    render();
  }
}
// An invite or reset email lands here with tokens in the URL fragment.
async function consumeAuthLink(){
  const h = location.hash || '';
  if(h.indexOf('access_token=') < 0) return false;
  const q = new URLSearchParams(h.replace(/^#/, ''));
  const token = q.get('access_token'), type = q.get('type') || '';
  A.refresh = q.get('refresh_token') || null;
  history.replaceState(null, '', location.pathname + location.search);
  if(!token) return false;
  try {
    A.token = token;
    const user = await sbFetch('/auth/v1/user');
    A.user = user; saveSession(); dataLoaded = false;
    A.linkType = type; A.profile = null;
    if(type === 'recovery' || type === 'invite'){ A.authView = 'setpw'; return true; }
    // Email confirmed after sign-up: the password is already set, so issue the alias.
    const alias = await ensureProfile();
    if(alias){ A.signedUpAlias = alias; A.authView = 'issued'; A.profile = null; }
    return true;
  } catch(e){ clearSession(); A.authMsg = 'That link has expired. Ask for a new one.'; return false; }
}

// Switch between the sign-in views, clearing any message from the last one.
function authGo(view){ A.authView = view; A.authMsg = ''; A.authOk = ''; A.draft = null; render(); }

// Enter submits; the first empty field gets focus.
function wireAuthForm(submit, firstId){
  const card = document.querySelector('.auth-card'); if(!card) return;
  card.querySelectorAll('input').forEach(function(el){
    el.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); window[submit](); } });
  });
  const empty = Array.from(card.querySelectorAll('input')).find(function(el){ return !el.value; }) || document.getElementById(firstId);
  if(empty) setTimeout(function(){ empty.focus(); }, 0);
}

function togglePw(id, btn){
  const el = document.getElementById(id); if(!el) return;
  const show = el.type === 'password';
  el.type = show ? 'text' : 'password'; btn.textContent = show ? 'Hide' : 'Show';
  el.focus();
}

// What was typed survives a re-render (an error, or the busy state).
function keepDraft(ids){
  A.draft = {};
  ids.forEach(function(id){ const el = document.getElementById(id); if(el) A.draft[id] = el.value; });
}

async function doSignIn(){
  const u = (document.getElementById('si_user')||{}).value || '';
  const p = (document.getElementById('si_pass')||{}).value || '';
  keepDraft(['si_user']);
  if(!u.trim() || !p){ A.authMsg = 'Please enter your alias and password.'; return render(); }
  A.authBusy = true; A.authMsg = ''; A.authOk = ''; render();
  try {
    const newAlias = await signIn(u, p);
    A.authBusy = false; A.draft = null;
    // Only set on the very first sign-in, when the profile was just created.
    if(newAlias){ A.signedUpAlias = newAlias; A.authView = 'issued'; A.profile = null; }
    render();
  }
  catch(e){
    A.authBusy = false;
    A.authMsg = /Invalid/i.test(e.message) ? 'That alias and password do not match.' : e.message;
    render();
  }
}

async function doSignUp(){
  const g = function(id){ return ((document.getElementById(id)||{}).value || '').trim(); };
  const email = g('su_email').toLowerCase(), code = g('su_code'), pass = g('su_pass');
  keepDraft(['su_email','su_code']);
  if(!email || !code || !pass){ A.authMsg = 'Email, join code and a password are all needed.'; return render(); }
  if(pass.length < 6){ A.authMsg = 'Passwords must be at least 6 characters.'; return render(); }
  A.authBusy = true; A.authMsg = ''; A.authOk = ''; render();
  try {
    // The join function checks the code and creates the account; then we sign
    // straight in with the password just chosen, and the alias is issued.
    await sbFetch('/functions/v1/sl-join', { method:'POST', body: JSON.stringify({ email, code, password: pass }) });
    const alias = await signIn(email, pass);
    A.authBusy = false; A.draft = null;
    if(alias){ A.signedUpAlias = alias; A.authView = 'issued'; A.profile = null; }
    else { A.authView = 'signin'; }
    render();
  }
  catch(e){
    A.authBusy = false;
    A.authMsg = /rate limit/i.test(e.message) ? 'Too many attempts right now. Try again in a little while.' : e.message;
    render();
  }
}

async function doReset(){
  const email = ((document.getElementById('rs_email')||{}).value || '').trim();
  keepDraft(['rs_email']);
  if(!email){ A.authMsg = 'Please enter your email address.'; return render(); }
  try { await sendReset(email); A.authMsg = ''; A.authView = 'signin'; A.draft = null; A.authOk = 'If an account exists for that address, a reset link has been sent.'; render(); }
  catch(e){ A.authMsg = e.message; render(); }
}

function sbHeaders(auth){

async function sbFetch(path, opts, retried){
  if(A.token && A.refresh && !path.startsWith('/auth/v1/token')) await ensureFreshToken();
  const r = await fetch(SB + path, { ...(opts||{}), headers:{ ...sbHeaders(true), ...((opts||{}).headers||{}) } });
  const text = await r.text();
  let body = null; try { body = text ? JSON.parse(text) : null; } catch(e){}
  if(!r.ok){
    const msg = (body && (body.message || body.error_description || body.msg || (typeof body.error === 'string' ? body.error : null))) || r.statusText;
    if(!retried && A.token && (r.status === 401 || /jwt expired|invalid jwt|token is expired/i.test(msg))){
      try { await refreshSession(); return sbFetch(path, opts, true); }
      catch(e){ signOut(); toast('Your session expired. Please sign in again.'); throw e; }
    }
    throw new Error(msg);
  }
  return body;
}

  return a + ' ' + n + ' ' + (10 + Math.floor(Math.random()*89));
}
function aliasChoices(){ const out=[]; while(out.length<5){ const a=randomAlias(); if(!out.includes(a)) out.push(a); } return out; }

function saveSession(){ try{ localStorage.setItem(AUTH_LS, JSON.stringify({ token:A.token, refresh:A.refresh, user:A.user })); }catch(e){} }
// Access tokens last an hour. The refresh token swaps them for new ones; any
// request that comes back with an expired token is retried once after that.
function tokenExp(){ try { return JSON.parse(atob(A.token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp * 1000; } catch(e){ return 0; } }
let refreshing = null;
async function refreshSession(){
  if(!A.refresh) throw new Error('Session expired. Please sign in again.');
  if(refreshing) return refreshing;
  refreshing = (async () => {
    const r = await fetch(SB + '/auth/v1/token?grant_type=refresh_token', { method:'POST', headers:{ apikey:SKEY, 'Content-Type':'application/json' }, body: JSON.stringify({ refresh_token: A.refresh }) });
    const d = await r.json().catch(() => null);
    if(!r.ok || !d || !d.access_token) throw new Error('Session expired. Please sign in again.');
    A.token = d.access_token; A.refresh = d.refresh_token || A.refresh; if(d.user) A.user = d.user; saveSession();
    return true;
  })();
  try { return await refreshing; } finally { refreshing = null; }
}
async function ensureFreshToken(){
  if(!A.token || !A.refresh) return;
  if(tokenExp() - Date.now() < 5*60*1000) { try { await refreshSession(); } catch(e) {} }
}
function clearSession(){ try{ localStorage.removeItem(AUTH_LS); }catch(e){} A.token=null; A.refresh=null; A.user=null; A.profile=null; }

async function loadProfile(){
  const rows = await sbFetch('/rest/v1/sl_profiles?select=*&id=eq.' + A.user.id);
  A.profile = rows && rows[0] ? rows[0] : null;
  // The app knows you by whichever alias fits what you're currently doing.
  if(A.profile){
    S.me.name  = currentAlias();
    S.me.grade = A.profile.grade_level || S.me.grade;
  }
}

async function signIn(idOrEmail, password){
  // You sign in with your alias. The email behind it is resolved server-side by
  // sl_login_email, which checks the password before returning anything — so
  // aliases, which are public by design, can't be used to harvest addresses.
  let email = idOrEmail.trim();
  if(!email.includes('@')){
    const found = await sbFetch('/rest/v1/rpc/sl_login_email', {
      method:'POST', headers:{ Authorization:'Bearer ' + SKEY },
      body: JSON.stringify({ p_alias: email, p_password: password })
    });
    if(!found) throw new Error('Invalid login credentials');
    email = found;
  }
  const d = await sbFetch('/auth/v1/token?grant_type=password', {
    method:'POST', headers:{ Authorization:'Bearer ' + SKEY },
    body: JSON.stringify({ email, password })
  });
  A.token = d.access_token; A.refresh = d.refresh_token; A.user = d.user; saveSession(); dataLoaded = false;
  return await ensureProfile();   // issues the alias if this is their first sign-in
}

async function signUp({ email, password, realName, gradeLevel }){
  // Create the account first. The alias used to be claimed before this, which
  // burned a Student number every time a signup failed and showed an error
  // where the alias should have been.
  const d = await sbFetch('/auth/v1/signup', {
    method:'POST', headers:{ Authorization:'Bearer ' + SKEY },
    body: JSON.stringify({
      email: email.trim(), password,
      data: { real_name: realName.trim(), grade_level: Number(gradeLevel) || null }
    })
  });
  A.token = d.access_token || (d.session && d.session.access_token);
  A.refresh = d.refresh_token || (d.session && d.session.refresh_token);
  A.user  = d.user || (d.session && d.session.user);
  // No session means email confirmation is on. The account exists, but nothing
  // can be written as them until they confirm and sign in, so the alias is
  // issued then instead.
  if(!A.token) return null;
  saveSession();
  return await ensureProfile();
}

// Give this account a profile and a student number if it doesn't have one yet.
// Runs on first sign-in as well as after signup, so it works whether or not
// email confirmation is switched on.
async function ensureProfile(){
  await loadProfile();
  if(A.profile) return null;
  const alias = await sbFetch('/rest/v1/rpc/sl_next_alias', {
    method:'POST', body: JSON.stringify({ kind:'student' })
  });
  const meta = (A.user && A.user.user_metadata) || {};
  await sbFetch('/rest/v1/sl_profiles', {
    method:'POST', headers:{ Prefer:'return=minimal' },
    body: JSON.stringify({
      id: A.user.id,
      real_name: meta.real_name || 'Unknown',
      grade_level: meta.grade_level || null,
      student_alias: alias
    })
  });
  await loadProfile();
  return alias;   // non-null only the first time, so the alias screen shows once
}

// Claim a tutor alias the first time someone offers to tutor, so their two
// identities are separate numbers that can't be matched to each other.
async function ensureTutorAlias(){
  if(A.profile && A.profile.tutor_alias) return A.profile.tutor_alias;
  const alias = await sbFetch('/rest/v1/rpc/sl_next_alias', {
    method:'POST', body: JSON.stringify({ kind:'tutor' })
  });
  await sbFetch('/rest/v1/sl_profiles?id=eq.' + A.user.id, {
    method:'PATCH', headers:{ Prefer:'return=minimal' },
    body: JSON.stringify({ tutor_alias: alias })
  });
  await loadProfile();
  return alias;
}

async function sendReset(email){
  await sbFetch('/auth/v1/recover?redirect_to=' + encodeURIComponent(APP_URL), {
    method:'POST', headers:{ Authorization:'Bearer ' + SKEY },
    body: JSON.stringify({ email: email.trim() })
  });
}

async function restoreSession(){
  try{
    const raw = localStorage.getItem(AUTH_LS); if(!raw) return false;
    const s = JSON.parse(raw); if(!s || !s.token) return false;
    A.token = s.token; A.refresh = s.refresh || null; A.user = s.user; dataLoaded = false;
    if(tokenExp() < Date.now()){ await refreshSession(); }   // came back after an hour or more
    await loadProfile();
    return !!A.profile;
  }catch(e){ clearSession(); return false; }
}
function signOut(){
  clearSession(); dataLoaded=false; A.role='student';
  Object.assign(S, { myRequests:[], incoming:[], posts:[], tutors:[], myClasses:[], tutorClasses:[], events:[], hours:0, helped:0, tab:'home', overlay:null });
  S.me = { name:'You', grade:11, isTutor:false, tutorCourses:[], avail:'' };
  A.authView='signin'; render();
}

/* ============================= DATA (server) ============================= */
// Everything the signed-in person can see, loaded after sign-in and again
// after any change. A school's worth of rows is small; no paging needed.
let dataLoaded = false, dataLoading = false, dataError = null;
async function loadData(){
  if(!A.user) return;
  const me = A.user.id;
  if(dataLoaded) { try { await loadProfile(); } catch(e) {} }   // background refreshes pick up profile changes too
  let [classes, tcourses, reqs, events, tutors, posts, myGrades, pendingGrades, materials, roster, presence, people, allReqs, inbox, settings, groups, groupMembers, ratings, reports, allGrades, avail] = await Promise.all([
    sbFetch('/rest/v1/sl_student_classes?select=course&user_id=eq.'+me+'&order=created_at'),
    sbFetch('/rest/v1/sl_tutor_courses?select=course,grade,year,availability&user_id=eq.'+me+'&order=created_at'),
    sbFetch('/rest/v1/sl_requests?select=*&or=(student_id.eq.'+me+',tutor_id.eq.'+me+')&order=created_at.desc'),
    sbFetch('/rest/v1/sl_events?select=*&user_id=eq.'+me+'&order=date'),
    sbFetch('/rest/v1/sl_tutors?select=*'),
    sbFetch('/rest/v1/sl_posts?select=*&order=created_at.desc&limit=500'),
    sbFetch('/rest/v1/sl_grades?select=id,course,grade,year,status,reviewed_at&user_id=eq.'+me),
    isStaff() ? sbFetch('/rest/v1/sl_grades?select=user_id&status=eq.pending') : Promise.resolve([]),
    sbFetch('/rest/v1/sl_materials?select=*&order=created_at.desc&limit=500'),
    sbFetch('/rest/v1/sl_class_students?select=*'),
    sbFetch('/rest/v1/sl_request_presence?select=*'),
    sbFetch('/rest/v1/sl_people?select=*'),
    isAdmin() ? sbFetch('/rest/v1/sl_requests?select=*&order=created_at.desc&limit=500') : Promise.resolve([]),
    sbFetch('/rest/v1/sl_messages?select=id,request_id,sender_id,body,created_at&sender_id=neq.'+me+'&order=created_at.desc&limit=60').catch(()=>[]),
    sbFetch('/rest/v1/sl_settings?select=key,value').catch(()=>[]),
    sbFetch('/rest/v1/sl_groups?select=*&order=created_at').catch(()=>null),
    sbFetch('/rest/v1/sl_group_members?select=*').catch(()=>[]),
    sbFetch('/rest/v1/sl_ratings?select=*'+(isStaff()?'':'&rater_id=eq.'+me)).catch(()=>[]),
    isStaff() ? sbFetch('/rest/v1/sl_reports?select=*&status=eq.open&order=created_at.desc').catch(()=>[]) : Promise.resolve([]),
    isStaff() ? sbFetch('/rest/v1/sl_grades?select=*').catch(()=>[]) : Promise.resolve([]),
    sbFetch('/rest/v1/sl_availability?select=*&order=recurring.desc,weekday,date,start_min'),
  ]);
  const fixC = rows => (rows||[]).map(r => r && r.course ? { ...r, course: canon(r.course) } : r);
  classes=fixC(classes); tcourses=fixC(tcourses); reqs=fixC(reqs); events=fixC(events); tutors=fixC(tutors); posts=fixC(posts); myGrades=fixC(myGrades); materials=fixC(materials); roster=fixC(roster); allReqs=fixC(allReqs);
  S.myClasses = [...new Set((classes||[]).map(r=>r.course))];
  S.tutorClasses = [...new Set((tcourses||[]).map(r=>r.course))];
  S.me.tutorCourses = (tcourses||[]).map(r=>{ const g=(myGrades||[]).find(x=>x.course===r.course); return { course:r.course, grade:r.grade||'', year:r.year||'', verify: g ? g.status : 'none' }; });
  S.taken = myGrades||[];   // classes I've taken, from setup; the only ones I may tutor
  S.pendingGrades = new Set((pendingGrades||[]).map(g=>g.user_id)).size;   // people waiting, not grades
  S.me.avail = ((tcourses||[]).find(r=>r.availability)||{}).availability || '';
  S.me.isTutor = !!(A.profile && A.profile.tutor_alias) && S.tutorClasses.length > 0;
  S.myRequests = (reqs||[]).filter(r=>r.student_id===me);
  S.incoming = (reqs||[]).filter(r=>r.tutor_id===me);
  S.events = events||[];
  S.posts = posts||[];
  S.materials = materials||[];
  S.roster = (roster||[]).filter(r => r.user_id !== me && !(people||[]).some(p => p.user_id===r.user_id && p.role==='admin'));
  S.presence = {}; (presence||[]).forEach(function(x){ S.presence[x.request_id] = x.other_seen_at; });
  S.people = (people||[]).filter(x => x.user_id !== me);
  S.allRequests = allReqs||[];
  S.availability = avail||[];
  S.inbox = inbox||[];
  S.settings = {}; (settings||[]).forEach(r=>{ S.settings[r.key]=r.value; });
  applySessionSettings(S.settings.sessions);
  S.groupsReady = Array.isArray(groups);      // null means the tables aren't there yet
  S.groups = fixC(groups||[]);
  S.groupMembers = groupMembers||[];
  S.ratings = fixC(ratings||[]);
  S.reports = reports||[];
  S.allGrades = fixC(allGrades||[]);
  S.tutors = buildTutors(tutors||[], me);
  S.helped = S.incoming.filter(r=>r.status==='done').length;
  S.hours = Math.round(S.helped*0.75*100)/100;
  if(S.mode==='tutor' && !(A.profile && A.profile.tutor_alias)) S.mode='tutee';
  A.role = (S.mode==='tutor' && A.profile && A.profile.tutor_alias) ? 'tutor' : 'student';
  S.me.name = currentAlias();
  dataLoaded = true;
  heartbeat();
}
// One row per class per tutor comes back; fold them into one tutor each.
function buildTutors(rows, me){
  const by = {};
  rows.forEach(function(r){
    if(r.user_id===me) return;
    const t = by[r.user_id] || (by[r.user_id] = { id:r.user_id, name:r.tutor_alias, grade:r.grade_level, bio:r.tutor_bio||'', format:r.tutor_format||'In person', seen:r.last_seen_at,
      avail:'', sessions:Number(r.sessions_done)||0, courses:[], color:TUTOR_COLORS[hashStr(r.user_id)%TUTOR_COLORS.length] });
    t.courses.push({ course:r.course, grade:r.grade||'', year:r.year||'', verified:!!r.verified });
    if(r.availability && !t.avail) t.avail = r.availability;
  });
  return Object.values(by);
}
// Online status. The app pings while it is open; anyone seen in the last two
// minutes shows as online. Only the alias and the dot are ever shown.
function isOnline(ts){ return !!ts && (Date.now() - new Date(ts).getTime()) < 2*60*1000; }
function seenLabel(ts){
  if(!ts) return '';
  const m = Math.round((Date.now() - new Date(ts).getTime())/60000);
  if(m < 2) return 'Online now';
  if(m < 60) return 'Active '+m+'m ago';
  const h = Math.round(m/60); if(h < 24) return 'Active '+h+'h ago';
  const d = Math.round(h/24); return d===1 ? 'Active yesterday' : 'Active '+d+' days ago';
}
const seenHtml = ts => ts ? `<span class="seen ${isOnline(ts)?'on':''}">${isOnline(ts)?'● ':''}${seenLabel(ts)}</span>` : '';
// An avatar with the little status dot.
const avatarDot = (inner, ts, style) => `<span class="avwrap"><div class="avatar" style="${style||''}">${inner}</div><span class="odot ${isOnline(ts)?'on':''}" title="${seenLabel(ts)||'Not seen yet'}"></span></span>`;
let lastBeat = 0;
function heartbeat(){
  if(!A.user || !A.profile || Date.now() - lastBeat < 45000) return;
  lastBeat = Date.now();
  sbFetch('/rest/v1/sl_profiles?id=eq.'+A.user.id, { method:'PATCH', headers:{ Prefer:'return=minimal' }, body:JSON.stringify({ last_seen_at:new Date().toISOString() }) }).catch(function(){});
}
setInterval(function(){ if(!document.hidden) heartbeat(); }, 60000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) heartbeat(); });

// Pick up what other people did while this tab was in the background.
document.addEventListener('visibilitychange', function(){ if(!document.hidden && A.profile && dataLoaded) loadData().then(function(){ if(!S.overlay) render(); }).catch(function(){}); });
setInterval(function(){ if(!document.hidden && A.profile && dataLoaded) loadData().then(function(){ if(!S.overlay) render(); }).catch(function(){}); }, 60000);

// ---- Reminders ----
// Five minutes before a confirmed session, a notification says where to go.
// Browser notifications only fire while the app is open (a tab, or the icon
// on a phone's home screen); a toast shows as well. Off until switched on in
// Settings, which asks the browser for permission.
const REMIND_LS='sc-remind', REMINDED_LS='sc-reminded';
const remindOn = () => { try { return localStorage.getItem(REMIND_LS)==='1'; } catch { return false; } };
async function setRemind(on){
  if(on && 'Notification' in window && Notification.permission!=='granted'){ const p=await Notification.requestPermission(); if(p!=='granted'){ toast('Notifications are blocked in the browser settings.'); on=false; } }
  try { localStorage.setItem(REMIND_LS, on?'1':'0'); } catch {}
  render(); if(on) checkReminders();
}
function checkReminders(){
  if(!remindOn() || !A.user) return;
  const now=new Date(), today=ymd(now), nowMin=now.getHours()*60+now.getMinutes();
  let seen; try { seen=JSON.parse(localStorage.getItem(REMINDED_LS)||'{}'); } catch { seen={}; }
  [...(S.myRequests||[]), ...(S.incoming||[])].filter(r=>r.status==='accepted' && r.date===today).forEach(r=>{
    const start=slotMin(splitOptions(r.time)[0]); if(start===null) return;
    const lead=start-nowMin; if(lead>5 || lead<-2 || seen[r.id]) return;
    seen[r.id]=Date.now();
    const o=otherSide(r), title='SilverCircle · '+(r.course)+' in '+Math.max(lead,0)+' min';
    const body=(r.location ? 'Head to '+r.location : 'Place not set')+' · with '+(o.alias||'')+' at '+(r.time||'');
    toast('⏰ '+title+' — '+body);
    if('Notification' in window && Notification.permission==='granted'){ try { new Notification(title, { body, icon:'img/logo-icon.png', tag:'sc-'+r.id }); } catch {} }
  });
  const cut=Date.now()-86400000; Object.keys(seen).forEach(k=>{ if(seen[k]<cut) delete seen[k]; });
  try { localStorage.setItem(REMINDED_LS, JSON.stringify(seen)); } catch {}
}
setInterval(checkReminders, 30000);
// Flip the composers on and off at the quiet-hours boundary without a reload.
let lastQuiet=null; setInterval(function(){ const q=inQuietHours(); if(lastQuiet!==null && q!==lastQuiet && A.profile && dataLoaded) render(); lastQuiet=q; }, 30000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) checkReminders(); });

/* ============================= INIT ============================= */
load();
consumeAuthLink().then(function(fromLink){ return fromLink ? null : restoreSession(); }).then(function(){ render(); });
</script>
